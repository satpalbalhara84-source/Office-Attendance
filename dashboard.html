<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Dashboard - Office Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f6fa;
    color:#111827;
}

header{
    background:#2563eb;
    color:white;
    padding:18px 20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:5px 0 0;
    opacity:.9;
}

.logout{
    background:#dc2626;
    border:0;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.card h2{
    margin-top:0;
    color:#1f2937;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;
}

.primary{
    background:#2563eb;
    color:white;
}

.primary:hover{
    background:#1d4ed8;
}

.success{
    background:#16a34a;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}

.message{
    margin-top:12px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.message.success-msg{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error-msg{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.stat h3{
    margin:0;
    font-size:28px;
    color:#2563eb;
}

.stat p{
    margin:7px 0 0;
    color:#6b7280;
}

.employee-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.employee{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
}

.employee h3{
    margin:0 0 8px;
}

.employee p{
    margin:6px 0;
    color:#4b5563;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.badge.in{
    background:#dcfce7;
    color:#166534;
}

.badge.out{
    background:#fee2e2;
    color:#991b1b;
}

.badge.unknown{
    background:#fef3c7;
    color:#92400e;
}

.small-btn{
    margin-top:10px;
    margin-right:6px;
    padding:9px 12px;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .employee-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    header h1{
        font-size:20px;
    }

}

</style>
</head>

<body>

<header>

<div class="header-inner">

<div>
<h1>Office Attendance</h1>
<p>Owner Dashboard</p>
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</header>


<div class="container">


<!-- OWNER INFORMATION -->

<div class="card">

<h2>Owner Information</h2>

<div id="ownerInfo">
Loading...
</div>

</div>


<!-- ADD NEW EMPLOYEE -->

<div class="card">

<h2>➕ Add New Employee</h2>

<p style="color:#6b7280;">
नया employee बनाने के लिए नीचे की जानकारी भरें।
</p>

<div class="form-grid">

<div>
<label>Employee Name</label>
<input
id="employeeName"
type="text"
placeholder="जैसे Rahul"
>
</div>

<div>
<label>Mobile Number</label>
<input
id="employeePhone"
type="text"
placeholder="Mobile Number"
>
</div>

<div>
<label>Employee Email</label>
<input
id="employeeEmail"
type="email"
placeholder="employee@gmail.com"
>
</div>

<div>
<label>Password</label>
<input
id="employeePassword"
type="password"
placeholder="Employee Password"
>
</div>

<div>
<label>Factory</label>
<select id="factorySelect">
<option value="">Factory चुनें</option>
</select>
</div>

</div>

<button
class="primary"
style="margin-top:15px;"
onclick="addEmployee()"
id="addEmployeeBtn"
>
Add Employee
</button>

<div id="addMessage" class="message"></div>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">
<h3 id="totalEmployees">0</h3>
<p>Total Employees</p>
</div>

<div class="stat">
<h3 id="totalIn">0</h3>
<p>Currently IN</p>
</div>

<div class="stat">
<h3 id="totalOut">0</h3>
<p>Currently OUT</p>
</div>

<div class="stat">
<h3 id="totalWorking">0h</h3>
<p>Total Working Time</p>
</div>

</div>


<!-- EMPLOYEES -->

<div class="card" style="margin-top:20px;">

<h2>👥 Employees</h2>

<div id="employeeList" class="employee-grid">

<div class="loading">
Employees loading...
</div>

</div>

</div>


</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   GLOBAL VARIABLES
===================================== */

let currentUser = null;
let employees = [];
let factories = [];


/* =====================================
   START
===================================== */

window.onload = async function(){

    await checkLogin();

};


/* =====================================
   CHECK LOGIN
===================================== */

async function checkLogin(){

    const {
        data:{
            session
        }
    } =
    await db.auth.getSession();


    if(!session){

        window.location.href =
        "owner-login.html";

        return;

    }


    currentUser =
    session.user;


    document.getElementById("ownerInfo").innerHTML = `

        <strong>Email:</strong>
        ${escapeHtml(currentUser.email)}

        <br><br>

        <strong>User ID:</strong>
        ${escapeHtml(currentUser.id)}

    `;


    await loadFactories();

    await loadEmployees();

}


/* =====================================
   LOAD FACTORIES
===================================== */

async function loadFactories(){

    const {
        data,
        error
    } =
    await db
    .from("factories")
    .select("id,name,address,status")
    .eq("owner_id",currentUser.id)
    .order("created_at",{ascending:false});


    if(error){

        console.error(error);

        document.getElementById(
            "factorySelect"
        ).innerHTML =
        `<option value="">Factory load नहीं हुई</option>`;

        return;

    }


    factories = data || [];


    const select =
    document.getElementById(
        "factorySelect"
    );


    select.innerHTML =
    `<option value="">Factory चुनें</option>`;


    factories.forEach(factory=>{

        const option =
        document.createElement("option");

        option.value =
        factory.id;

        option.textContent =
        factory.name;

        select.appendChild(option);

    });


    if(factories.length === 1){

        select.value =
        factories[0].id;

    }

}


/* =====================================
   LOAD EMPLOYEES
===================================== */

async function loadEmployees(){

    const {
        data,
        error
    } =
    await db
    .from("employees")
    .select("*")
    .eq("owner_id",currentUser.id)
    .order("created_at",{ascending:false});


    if(error){

        console.error(error);

        document.getElementById(
            "employeeList"
        ).innerHTML =
        `<div class="loading">
        Employee load नहीं हुए
        </div>`;

        return;

    }


    employees =
    data || [];


    document.getElementById(
        "totalEmployees"
    ).innerText =
    employees.length;


    await renderEmployees();

}


/* =====================================
   RENDER EMPLOYEES
===================================== */

async function renderEmployees(){

    const container =
    document.getElementById(
        "employeeList"
    );


    if(employees.length === 0){

        container.innerHTML = `
            <div class="loading">
                अभी कोई employee नहीं है।
            </div>
        `;

        document.getElementById(
            "totalIn"
        ).innerText="0";

        document.getElementById(
            "totalOut"
        ).innerText="0";

        return;

    }


    let html="";

    let inCount=0;

    let outCount=0;

    let totalMinutes=0;


    for(const employee of employees){

        const status =
        await getEmployeeStatus(
            employee.id
        );


        if(status.status === "IN"){
            inCount++;
        }else{
            outCount++;
        }


        totalMinutes +=
        status.minutes || 0;


        const badgeClass =
        status.status === "IN"
        ? "in"
        : "out";


        html += `

        <div class="employee">

            <h3>
                ${escapeHtml(employee.name || "Employee")}
            </h3>

            <p>
                📱
                ${escapeHtml(employee.phone || "-")}
            </p>

            <p>
                ✉️
                ${escapeHtml(employee.email || "-")}
            </p>

            <p>
                Status:
                <span class="badge ${badgeClass}">
                    ${status.status}
                </span>
            </p>

            <p>
                ⏱️ Today:
                <strong>
                    ${formatMinutes(status.minutes || 0)}
                </strong>
            </p>

            <button
                class="primary small-btn"
                onclick="viewEmployee('${employee.id}')"
            >
                View Details
            </button>

        </div>

        `;

    }


    container.innerHTML =
    html;


    document.getElementById(
        "totalIn"
    ).innerText =
    inCount;


    document.getElementById(
        "totalOut"
    ).innerText =
    outCount;


    document.getElementById(
        "totalWorking"
    ).innerText =
    formatMinutes(totalMinutes);

}


/* =====================================
   GET EMPLOYEE STATUS
===================================== */

async function getEmployeeStatus(employeeId){

    const today =
    new Date();

    const year =
    today.getFullYear();

    const month =
    String(today.getMonth()+1)
    .padStart(2,"0");

    const day =
    String(today.getDate())
    .padStart(2,"0");

    const date =
    `${year}-${month}-${day}`;


    const {
        data,
        error
    } =
    await db
    .from("attendance")
    .select("*")
    .eq("employee_id",employeeId)
    .eq("date",date)
    .order("check_in",{ascending:false});


    if(error){

        console.error(error);

        return {
            status:"OUT",
            minutes:0
        };

    }


    if(!data || data.length===0){

        return {
            status:"OUT",
            minutes:0
        };

    }


    let totalMinutes=0;

    let currentStatus="OUT";


    data.forEach(row=>{

        if(row.check_in){

            currentStatus =
            row.check_out
            ? "OUT"
            : "IN";

        }


        if(row.check_in &&
           row.check_out){

            const start =
            new Date(row.check_in);

            const end =
            new Date(row.check_out);

            const diff =
            Math.max(
                0,
                Math.round(
                    (end-start)/60000
                )
            );

            totalMinutes += diff;

        }


        if(
            row.check_in &&
            !row.check_out
        ){

            currentStatus="IN";

            const start =
            new Date(row.check_in);

            const now =
            new Date();

            const diff =
            Math.max(
                0,
                Math.round(
                    (now-start)/60000
                )
            );

            totalMinutes += diff;

        }

    });


    return {
        status:currentStatus,
        minutes:totalMinutes
    };

}


/* =====================================
   ADD EMPLOYEE
===================================== */

async function addEmployee(){

    const name =
    document.getElementById(
        "employeeName"
    ).value.trim();


    const phone =
    document.getElementById(
        "employeePhone"
    ).value.trim();


    const email =
    document.getElementById(
        "employeeEmail"
    ).value.trim();


    const password =
    document.getElementById(
        "employeePassword"
    ).value;


    const factoryId =
    document.getElementById(
        "factorySelect"
    ).value;


    const btn =
    document.getElementById(
        "addEmployeeBtn"
    );


    const message =
    document.getElementById(
        "addMessage"
    );


    if(!name){

        showAddMessage(
            "Employee Name भरें।",
            false
        );

        return;

    }


    if(!phone){

        showAddMessage(
            "Mobile Number भरें।",
            false
        );

        return;

    }


    if(!email){

        showAddMessage(
            "Employee Email भरें।",
            false
        );

        return;

    }


    if(!password){

        showAddMessage(
            "Password भरें।",
            false
        );

        return;

    }


    if(password.length < 6){

        showAddMessage(
            "Password कम से कम 6 characters का होना चाहिए।",
            false
        );

        return;

    }


    if(!factoryId){

        showAddMessage(
            "Factory चुनें।",
            false
        );

        return;

    }


    btn.disabled=true;

    btn.innerText=
    "Employee बन रहा है...";


    try{

        /* =====================================
           CREATE USER THROUGH EDGE FUNCTION
        ===================================== */

        const {
            data,
            error
        } =
        await db.functions.invoke(
            "quick-endpoint",
            {
                body:{
                    name:name,
                    phone:phone,
                    email:email,
                    password:password
                }
            }
        );


        if(error){

            console.error(error);

            throw new Error(
                error.message ||
                "Employee create नहीं हुआ"
            );

        }


        console.log(
            "Create employee response:",
            data
        );


        /*
           Employee बनने के बाद email से
           employee record खोजेंगे
        */

        await new Promise(
            resolve =>
            setTimeout(resolve,1000)
        );


        const {
            data:createdEmployees,
            error:findError
        }
        =
        await db
        .from("employees")
        .select("id,owner_id,email")
        .eq("email",email)
        .eq("owner_id",currentUser.id)
        .limit(1);


        if(findError){

            console.error(findError);

        }


        if(
            createdEmployees &&
            createdEmployees.length > 0
        ){

            const employeeId =
            createdEmployees[0].id;


            /* =============================
               SET FACTORY
            ============================= */

            const {
                error:updateError
            }
            =
            await db
            .from("employees")
            .update({
                factory_id:factoryId
            })
            .eq("id",employeeId)
            .eq("owner_id",currentUser.id);


            if(updateError){

                console.error(
                    "Factory update error:",
                    updateError
                );

                showAddMessage(
                    "Employee बन गया, लेकिन Factory जोड़ने में समस्या हुई।",
                    false
                );

            }else{

                showAddMessage(
                    "Employee सफलतापूर्वक बन गया ✅",
                    true
                );

            }

        }else{

            showAddMessage(
                "Employee बन गया है, लेकिन उसकी Factory mapping verify नहीं हो सकी।",
                false
            );

        }


        /* =====================================
           CLEAR FORM
        ===================================== */

        document.getElementById(
            "employeeName"
        ).value="";

        document.getElementById(
            "employeePhone"
        ).value="";

        document.getElementById(
            "employeeEmail"
        ).value="";

        document.getElementById(
            "employeePassword"
        ).value="";


        await loadEmployees();


    }
    catch(err){

        console.error(err);

        showAddMessage(
            "Employee create नहीं हुआ: " +
            err.message,
            false
        );

    }
    finally{

        btn.disabled=false;

        btn.innerText=
        "Add Employee";

    }

}


/* =====================================
   MESSAGE
===================================== */

function showAddMessage(text,success){

    const box =
    document.getElementById(
        "addMessage"
    );


    box.innerText=text;

    box.className =
    success
    ? "message success-msg"
    : "message error-msg";

}


/* =====================================
   VIEW EMPLOYEE
===================================== */

function viewEmployee(id){

    const employee =
    employees.find(
        e => e.id === id
    );


    if(!employee){
        return;
    }


    alert(
`Employee Details

Name: ${employee.name || "-"}
Mobile: ${employee.phone || "-"}
Email: ${employee.email || "-"}
Factory ID: ${employee.factory_id || "-"}`
    );

}


/* =====================================
   FORMAT MINUTES
===================================== */

function formatMinutes(minutes){

    minutes =
    Math.max(
        0,
        Math.round(minutes || 0)
    );


    const hours =
    Math.floor(minutes/60);


    const mins =
    minutes % 60;


    return `${hours}h ${mins}m`;

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await db.auth.signOut();

    window.location.href =
    "owner-login.html";

}


/* =====================================
   AUTO REFRESH
===================================== */

setInterval(
    async function(){

        if(currentUser){

            await loadEmployees();

        }

    },
    30000
);

</script>

</body>
</html>
