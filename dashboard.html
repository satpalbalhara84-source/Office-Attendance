<script>


/* =====================================

===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const db =
supabase.createClient(

/* =====================================
   GLOBAL

let currentUser = null;

/* =====================================
   GET USER
===================================== */

async function getUser(){

const result =
await db.auth.getSession();


if(result.error){

showError(
result.error.message
);

return null;

}


if(!result.data.session){

window.location.href =
"employee-login.html";

return null;

}


currentUser =
result.data.session.user;


document.getElementById(
"ownerEmail"
).innerText =
currentUser.email;


return currentUser;

}


/* =====================================
   LOAD EMPLOYEES
===================================== */

async function loadEmployees(){

const result =
await db
.from("employees")
.select("*")
.eq(
"owner_id",
currentUser.id
)
.order(
"name",
{
ascending:true
}
);


if(result.error){

console.error(result.error);

showError(
"Employees load error: " +
result.error.message
);

return false;

}


employees =
result.data || [];


document.getElementById(
"totalEmployees"
).innerText =
employees.length;


return true;

}


/* =====================================
   DATE
===================================== */

function setToday(){

const d =
new Date();


const year =
d.getFullYear();


const month =
String(
d.getMonth()+1
).padStart(
2,
"0"
);


const day =
String(
d.getDate()
).padStart(
2,
"0"
);


document.getElementById(
"attendanceDate"
).value =
year + "-" +
month + "-" +
day;

}


function getDateRange(){

const value =
document.getElementById(
"attendanceDate"
).value;


if(!value){

return null;

}


const parts =
value.split("-");


const start =
new Date(
Number(parts[0]),
Number(parts[1])-1,
Number(parts[2]),
0,0,0,0
);


const end =
new Date(
Number(parts[0]),
Number(parts[1])-1,
Number(parts[2])+1,
0,0,0,0
);


return {

start:
start.toISOString(),

end:
end.toISOString()

};

}


/* =====================================
   LOAD TODAY ATTENDANCE
===================================== */

async function loadAttendance(){

attendanceData = [];


if(
employees.length === 0
){

return true;

}


const range =
getDateRange();


if(!range){

showError(
"Attendance date select करें।"
);

return false;

}


const ids =
employees.map(
e => e.id
);


const result =
await db
.from("attendance")
.select("*")
.in(
"employee_id",
ids
)
.gte(
"in_time",
range.start
)
.lt(
"in_time",
range.end
)
.order(
"in_time",
{
ascending:true
}
);


if(result.error){

console.error(
result.error
);

showError(
"Attendance load error: " +
result.error.message
);

return false;

}


attendanceData =
result.data || [];


return true;

}


/* =====================================
   STATUS
===================================== */

function getStatus(rows){

const open =
[...rows]
.reverse()
.find(
row =>
!row.out_time
);


if(!open){

return {

type:"out",

text:"🔴 OUT"

};

}


if(open.outside_since){

return {

type:"away",

text:"🟠 बाहर / Grace"

};

}


return {

type:"in",

text:"🟢 IN"

};

}


/* =====================================
   TOTAL MINUTES
===================================== */

function getTotalMinutes(rows){

let total = 0;


rows.forEach(
row => {

if(row.out_time){

total +=
Number(
row.working_minutes || 0
);

}

else if(row.in_time){

const start =
new Date(
row.in_time
).getTime();


const live =
Math.floor(
(
Date.now() -
start
) / 60000
);


total +=
Math.max(
0,
live
);

}

});


return total;

}


/* =====================================
   FORMAT MINUTES
===================================== */

function formatMinutes(
minutes
){

minutes =
Number(minutes) || 0;


const h =
Math.floor(
minutes / 60
);


const m =
minutes % 60;


return h + "h " + m + "m";

}


/* =====================================
   FORMAT TIME
===================================== */

function formatTime(
value
){

if(!value){

return "—";

}


return new Date(value)
.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
value
){

if(!value){

return "—";

}


return new Date(value)
.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
value
){

return String(value)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =====================================
   RENDER SESSIONS
===================================== */

function renderSessions(rows){

if(!rows.length){

return `
<div class="no-data">
आज कोई attendance session नहीं मिला।
</div>
`;

}


let html = `

<div style="overflow-x:auto">

<table>

<thead>

<tr>

<th>#</th>

<th>IN Time</th>

<th>OUT Time</th>

<th>Working</th>

<th>Status</th>

</tr>

</thead>

<tbody>

`;


rows.forEach(
(row,index) => {

let status =
"Completed";


if(!row.out_time){

status =
row.outside_since
? "🟠 Grace / Outside"
: "🟢 Running";

}


let working;


if(row.out_time){

working =
formatMinutes(
row.working_minutes
);

}else{

const live =
Math.floor(
(
Date.now() -
new Date(
row.in_time
).getTime()
) / 60000
);


working =
formatMinutes(
Math.max(
0,
live
)
) +
" (running)";

}


html += `

<tr>

<td>
${index+1}
</td>

<td>
${formatTime(
row.in_time
)}
</td>

<td>
${formatTime(
row.out_time
)}
</td>

<td>
${working}
</td>

<td>
${status}
</td>

</tr>

`;

});


html += `

</tbody>

</table>

</div>

`;


return html;

}

/* =====================================
   LOAD EMPLOYEE HISTORY
===================================== */

async function loadEmployeeHistory(
employeeId,
days
){

const historyBox =
document.getElementById(
"history-" + employeeId
);


if(!historyBox){

return;

}


historyBox.innerHTML = `

<div class="loading-history">

⏳ Attendance history loading...

</div>

`;


const end =
new Date();


const start =
new Date();


start.setDate(
start.getDate() -
(days - 1)
);


start.setHours(
0,0,0,0
);


end.setHours(
23,59,59,999
);


const result =
await db
.from("attendance")
.select("*")
.eq(
"employee_id",
employeeId
)
.gte(
"in_time",
start.toISOString()
)
.lte(
"in_time",
end.toISOString()
)
.order(
"in_time",
{
ascending:true
}
);


if(result.error){

console.error(
result.error
);

historyBox.innerHTML = `

<div class="no-data">

❌ History load error:
${escapeHtml(
result.error.message
)}

</div>

`;

return;

}


const rows =
result.data || [];


historyCache[
employeeId + "_" + days
] =
rows;


renderHistory(
employeeId,
rows,
days
);

}


/* =====================================
   RENDER HISTORY
===================================== */

function renderHistory(
employeeId,
rows,
days
){

const historyBox =
document.getElementById(
"history-" + employeeId
);


if(!historyBox){

return;

}


let totalMinutes = 0;

let presentDays = 0;

let absentDays = 0;


/*
Unique dates जिनमें attendance मिली
*/

const dates = {};


rows.forEach(
row => {

const date =
new Date(
row.in_time
).toLocaleDateString(
"en-CA"
);

dates[date] = true;

});


presentDays =
Object.keys(
dates
).length;


/*
Absent days
*/

const today =
new Date();


for(
let i=0;
i<days;
i++
){

const d =
new Date();

d.setDate(
today.getDate() - i
);

d.setHours(
0,0,0,0
);


const date =
d.toLocaleDateString(
"en-CA"
);


if(!dates[date]){

absentDays++;

}

}


/*
Total working
*/

rows.forEach(
row => {

if(row.out_time){

totalMinutes +=
Number(
row.working_minutes || 0
);

}else if(row.in_time){

const live =
Math.floor(
(
Date.now() -
new Date(
row.in_time
).getTime()
) / 60000
);

totalMinutes +=
Math.max(
0,
live
);

}

});


let html = `

<div class="history-summary">


<div class="history-stat">

<div class="history-stat-title">
Period
</div>

<div class="history-stat-value">
${days} Days
</div>

</div>


<div class="history-stat">

<div class="history-stat-title">
Present Days
</div>

<div
class="history-stat-value"
style="color:#16a34a">

${presentDays}

</div>

</div>


<div class="history-stat">

<div class="history-stat-title">
Absent Days
</div>

<div
class="history-stat-value"
style="color:#dc2626">

${absentDays}

</div>

</div>


<div class="history-stat">

<div class="history-stat-title">
Total Working
</div>

<div class="history-stat-value">

${formatMinutes(
totalMinutes
)}

</div>

</div>


</div>

`;


if(!rows.length){

html += `

<div class="no-data">

इस period में कोई attendance record नहीं मिला।

</div>

`;

historyBox.innerHTML =
html;

return;

}


html += `

<div class="history-table">

<table>

<thead>

<tr>

<th>Date</th>

<th>IN</th>

<th>OUT</th>

<th>Working</th>

<th>Status</th>

</tr>

</thead>

<tbody>

`;


/*
हर attendance session
*/

rows.forEach(
row => {

let date =
formatDate(
row.in_time
);


let working;


if(row.out_time){

working =
formatMinutes(
row.working_minutes
);

}else{

const live =
Math.floor(
(
Date.now() -
new Date(
row.in_time
).getTime()
) / 60000
);

working =
formatMinutes(
Math.max(
0,
live
)
) +
" (running)";

}


let status;


if(!row.out_time){

status =
row.outside_since
? "🟠 Outside"
: "🟢 Running";

}else{

status =
"✅ Present";

}


html += `

<tr>

<td>
${date}
</td>

<td>
${formatTime(
row.in_time
)}
</td>

<td>
${formatTime(
row.out_time
)}
</td>

<td>
${working}
</td>

<td>
${status}
</td>

</tr>

`;

});


html += `

</tbody>

</table>

</div>

`;


historyBox.innerHTML =
html;

}

${formatMinutes(
minutes
)}

</div>

</div>


</div>


<h3>
📊 Attendance History
</h3>


<div class="history-buttons">


<button
class="history-btn"
onclick="
setHistoryButton(
'${employee.id}',
7
);
loadEmployeeHistory(
'${employee.id}',
7
);
">

7 Days

</button>


<button
class="history-btn"
onclick="
setHistoryButton(
'${employee.id}',
30
);
loadEmployeeHistory(
'${employee.id}',
30
);
">

30 Days

</button>


</div>


<div
id="history-${employee.id}"
class="history-box">

<div class="no-data">

ऊपर से 7 Days या 30 Days चुनें।

</div>

</div>


<button
class="close-btn"
onclick="
toggleDetails(
'${employee.id}'
);
">

▲ Close Details

</button>


</div>

`;

}


/* =====================================
   HISTORY BUTTON
===================================== */

function setHistoryButton(
employeeId,
days
){

const buttons =
document.querySelectorAll(
"#details-" +
employeeId +
" .history-btn"
);


buttons.forEach(
button => {

button.classList.remove(
"active"
);

});


buttons.forEach(
button => {

if(
button.innerText
.includes(
days + " Days"
)
){

button.classList.add(
"active"
);

}

});

}


/* =====================================
   RENDER DASHBOARD
===================================== */

function renderDashboard(){

const list =
document.getElementById(
"employeeList"
);


if(
employees.length === 0
){

list.innerHTML = `

<div class="no-data">

इस Owner के लिए अभी कोई employee नहीं मिला।

</div>

`;

document.getElementById(
"totalEmployees"
).innerText = "0";

document.getElementById(
"totalIn"
).innerText = "0";

document.getElementById(
"totalOut"
).innerText = "0";

document.getElementById(
"totalWorking"
).innerText = "0h 0m";

return;

}


let totalIn = 0;

let totalOut = 0;

let totalWorking = 0;

let html = "";


employees.forEach(
employee => {


const rows =
attendanceData.filter(
row =>
row.employee_id ===
employee.id
);


const status =
getStatus(rows);


const minutes =
getTotalMinutes(rows);


totalWorking +=
minutes;


if(
status.type === "in"
){

totalIn++;

}


if(
status.type === "out"
){

totalOut++;

}


let badgeClass =
"badge-out";


if(
status.type === "in"
){

badgeClass =
"badge-in";

}


if(
status.type === "away"
){

badgeClass =
"badge-away";

}


html += `

<div class="employee-card">


<div class="employee-header">


<div>


<div class="employee-name">

${escapeHtml(
employee.name ||
"Employee"
)}

</div>


<div class="employee-info">

📧 ${
escapeHtml(
employee.email ||
"—"
)
}

<br>

📱 ${
escapeHtml(
employee.phone ||
"—"
)
}

</div>


</div>


<div
class="badge ${badgeClass}">

${status.text}

</div>


</div>


<div class="total">

<div class="total-title">

आज का Total Working Time

</div>


<div class="total-time">

${formatMinutes(
minutes
)}

</div>

</div>


<h3>
Today's Sessions
</h3>


${renderSessions(
rows
)}


<button
class="details-btn"
onclick="
toggleDetails(
'${employee.id}'
);
">

👤 View Employee Details

</button>


${employeeDetails(
employee,
rows,
status,
minutes
)}


</div>

`;

});


list.innerHTML =
html;


document.getElementById(
"totalEmployees"
).innerText =
employees.length;


document.getElementById(
"totalIn"
).innerText =
totalIn;


document.getElementById(
"totalOut"
).innerText =
totalOut;


document.getElementById(
"totalWorking"
).innerText =
formatMinutes(
totalWorking
);


document.getElementById(
"message"
).innerHTML = `

Employees:
<b>
${employees.length}
</b>

&nbsp; | &nbsp;

Attendance Sessions:
<b>
${attendanceData.length}
</b>

`;

}


/* =====================================
   ERROR
===================================== */

function showError(
message
){

const box =
document.getElementById(
"message"
);


box.className =
"message error";


box.innerText =
"❌ " + message;

}


/* =====================================
   LOAD DASHBOARD
===================================== */

async function loadDashboard(){

if(!currentUser){

return;

}


const success =
await loadAttendance();


if(!success){

return;

}


renderDashboard();

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

await db.auth.signOut();

window.location.href =
"employee-login.html";

}


/* =====================================
   START APP
===================================== */

async function startApp(){

setToday();


const user =
await getUser();


if(!user){

return;

}


const ok =
await loadEmployees();


if(!ok){

return;

}


await loadDashboard();

}


/* =====================================
   AUTO REFRESH
===================================== */

setInterval(
async function(){

if(currentUser){

await loadDashboard();

}

},
30000
);


/* =====================================
   START
===================================== */

startApp();

</script>

</body>

</html>
