<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Office Attendance - Owner Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .logout {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
            font-size: 15px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        .add-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #15803d;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .employee {
            padding: 15px 5px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .employee-name {
            font-weight: bold;
            font-size: 16px;
        }

        .employee-info {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        @media(max-width: 700px) {

            .cards {
                grid-template-columns: 1fr 1fr;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 12px;
            }

            .employee {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>


<div class="header">

    <h2>Office Attendance</h2>

    <button
        class="logout"
        onclick="logout()">
        Logout
    </button>

</div>


<div class="container">


    <!-- SUMMARY -->

    <div class="cards">

        <div class="card">
            <h3>Total Employees</h3>
            <div class="number" id="totalEmployees">0</div>
        </div>

        <div class="card">
            <h3>Present Today</h3>
            <div class="number" id="presentEmployees">0</div>
        </div>

        <div class="card">
            <h3>Absent Today</h3>
            <div class="number" id="absentEmployees">0</div>
        </div>

        <div class="card">
            <h3>Working Hours</h3>
            <div class="number" id="workingHours">0</div>
        </div>

    </div>


  <!-- OFFICE SETUP -->

<div class="section">

    <h2>🏢 Office Location Setup</h2>

    <input
        type="text"
        id="officeName"
        placeholder="Office Name"
        style="width:100%; margin-bottom:15px;"
    >

    <input
        type="number"
        id="radius"
        placeholder="Office Radius (meters)"
        value="100"
        style="width:100%; margin-bottom:15px;"
    >

    <button
        class="add-btn"
        onclick="getOfficeLocation()"
        style="width:100%;"
    >
        📍 Get Current Location
    </button>

    <div
        id="locationMessage"
        style="margin-top:15px;">
    </div>

    <button
        class="add-btn"
        onclick="saveOffice()"
        style="width:100%; margin-top:15px;"
    >
        💾 Save Office Location
    </button>

</div> 
 <!-- CREATE EMPLOYEE -->

    <div class="section">

        <h2>➕ Create Employee Account</h2>

        <div class="form">

            <input
                type="text"
                id="employeeName"
                placeholder="Employee Name">

            <input
                type="text"
                id="employeePhone"
                placeholder="Mobile Number">

            <input
                type="email"
                id="employeeEmail"
                placeholder="Employee Email">

            <input
                type="password"
                id="employeePassword"
                placeholder="Employee Password">

            <button
                class="add-btn"
                onclick="createEmployee()">

                Create Employee Account

            </button>

        </div>

        <div id="message"></div>

    </div>


    <!-- EMPLOYEE LIST -->

    <div class="section">

        <h2>👥 Employees</h2>

        <div id="employeeList">
            Loading...
        </div>

    </div>

</div>


<script>


const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* CHECK OWNER LOGIN */

async function checkLogin() {

    const {
        data,
        error
    } = await supabaseClient
        .auth
        .getSession();

    if (error || !data.session) {

        window.location.href =
            "index.html";

        return false;
    }

    return true;
}



/* CREATE EMPLOYEE */

async function createEmployee() {

    const name =
        document.getElementById(
            "employeeName"
        ).value.trim();

    const phone =
        document.getElementById(
            "employeePhone"
        ).value.trim();

    const email =
        document.getElementById(
            "employeeEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "employeePassword"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    if (
        !name ||
        !phone ||
        !email ||
        !password
    ) {

        message.innerText =
            "कृपया सभी जानकारी भरें";

        message.style.color =
            "red";

        return;
    }


    if (password.length < 6) {

        message.innerText =
            "Password कम से कम 6 characters का होना चाहिए";

        message.style.color =
            "red";

        return;
    }


    message.innerText =
        "Employee account बनाया जा रहा है...";

    message.style.color =
        "#2563eb";


    /*
       Edge Function को call करें
    */

    const {
        data,
        error
    } = await supabaseClient.functions.invoke(
        "quick-endpoint",
        {
            body: {
                name: name,
                phone: phone,
                email: email,
                password: password
            }
        }
    );


    if (error) {

        message.innerText =
            "Error: " + error.message;

        message.style.color =
            "red";

        return;
    }


    if (!data || !data.success) {

        message.innerText =
            "Employee account नहीं बना: " +
            (data?.error || "Unknown error");

        message.style.color =
            "red";

        return;
    }


    message.innerText =
        "Employee Account Successfully Created ✅";

    message.style.color =
        "green";


    /*
       Form खाली करें
    */

    document.getElementById(
        "employeeName"
    ).value = "";

    document.getElementById(
        "employeePhone"
    ).value = "";

    document.getElementById(
        "employeeEmail"
    ).value = "";

    document.getElementById(
        "employeePassword"
    ).value = "";


    loadEmployees();

}



/* LOAD EMPLOYEES */

async function loadEmployees() {

    const {
        data: sessionData
    } = await supabaseClient
        .auth
        .getSession();


    if (!sessionData.session) {
        return;
    }


    const ownerId =
        sessionData.session.user.id;


    const {
        data,
        error
    } = await supabaseClient
        .from("employees")
        .select("*")
        .eq(
            "owner_id",
            ownerId
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        document.getElementById(
            "employeeList"
        ).innerText =
            error.message;

        return;
    }


    document.getElementById(
        "totalEmployees"
    ).innerText =
        data.length;


    const list =
        document.getElementById(
            "employeeList"
        );


    if (data.length === 0) {

        list.innerHTML =
            "<p>अभी कोई employee नहीं है।</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(employee => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "employee";


        div.innerHTML = `

            <div>

                <div class="employee-name">
                    ${employee.name}
                </div>

                <div class="employee-info">
                    📱 ${employee.phone}
                </div>

            </div>

            <div class="employee-info">
                ✉️ ${employee.email}
            </div>

        `;


        list.appendChild(div);

    });

}



/* LOGOUT */

async function logout() {

    await supabaseClient
        .auth
        .signOut();

    window.location.href =
        "index.html";
}



/* START */

(async function() {

    const loggedIn =
        await checkLogin();

    if (loggedIn) {

        await loadEmployees();

    }

})();
let officeLatitude = null;
let officeLongitude = null;


/* GET CURRENT OFFICE LOCATION */

function getOfficeLocation() {

    const message =
        document.getElementById("locationMessage");

    if (!navigator.geolocation) {

        message.innerText =
            "इस device में GPS/Location support नहीं है";

        message.style.color = "red";

        return;
    }

    message.innerText =
        "Location प्राप्त की जा रही है...";

    message.style.color = "#2563eb";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            officeLatitude =
                position.coords.latitude;

            officeLongitude =
                position.coords.longitude;


            message.innerText =
                "Location मिल गई ✅\n" +
                "Latitude: " +
                officeLatitude +
                "\nLongitude: " +
                officeLongitude;

            message.style.color = "green";

        },

        function(error) {

            message.innerText =
                "Location नहीं मिली: " +
                error.message;

            message.style.color = "red";

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


/* SAVE OFFICE */

async function saveOffice() {

    const officeName =
        document
        .getElementById("officeName")
        .value
        .trim();

    const radius =
        parseInt(
            document
            .getElementById("radius")
            .value
        );


    const message =
        document.getElementById(
            "locationMessage"
        );


    if (!officeName) {

        message.innerText =
            "Office Name डालें";

        message.style.color = "red";

        return;
    }


    if (
        officeLatitude === null ||
        officeLongitude === null
    ) {

        message.innerText =
            "पहले Get Current Location दबाएँ";

        message.style.color = "red";

        return;
    }


    if (!radius || radius < 20) {

        message.innerText =
            "Radius कम से कम 20 meters रखें";

        message.style.color = "red";

        return;
    }


    const {
        data: sessionData
    } =
    await supabaseClient
        .auth
        .getSession();


    if (!sessionData.session) {

        window.location.href =
            "index.html";

        return;
    }


    const ownerId =
        sessionData.session.user.id;


    message.innerText =
        "Office location save हो रही है...";


    const {
        error
    } =
    await supabaseClient
        .from("offices")
        .insert({

            owner_id:
                ownerId,

            office_name:
                officeName,

            latitude:
                officeLatitude,

            longitude:
                officeLongitude,

            radius_meters:
                radius

        });


    if (error) {

        message.innerText =
            "Error: " + error.message;

        message.style.color = "red";

        return;
    }


    message.innerText =
        "Office Location Successfully Saved ✅";

    message.style.color = "green";

}

</script>

</body>
</html>
