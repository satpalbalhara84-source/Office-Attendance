<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Owner Attendance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f6fa;
    color:#111827;
}

.header{
    background:#2563eb;
    color:white;
    padding:20px;
}

.header h2{
    margin:0;
}

.header p{
    margin:6px 0 0;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stat-title{
    color:#6b7280;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.blue{color:#2563eb;}
.green{color:#16a34a;}
.red{color:#dc2626;}
.orange{color:#ea580c;}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group select{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

.full{
    grid-column:1 / -1;
}

.add-btn{
    background:#16a34a;
    margin-top:15px;
}

.date-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.date-box input{
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

button{
    padding:11px 18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    color:white;
    background:#2563eb;
    font-size:15px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.refresh{
    background:#16a34a;
}

.logout{
    background:#dc2626;
    width:100%;
    margin-top:10px;
}

.message{
    padding:12px;
    background:#eff6ff;
    border-radius:8px;
    margin-bottom:20px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.employee-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
}

.employee-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.employee-name{
    font-size:21px;
    font-weight:bold;
}

.employee-info{
    color:#6b7280;
    margin-top:5px;
    line-height:1.7;
}

.badge{
    padding:7px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
}

.badge-in{
    background:#dcfce7;
    color:#166534;
}

.badge-out{
    background:#fee2e2;
    color:#991b1b;
}

.badge-away{
    background:#ffedd5;
    color:#9a3412;
}

.total{
    background:#eff6ff;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
}

.total-title{
    font-size:14px;
    color:#6b7280;
}

.total-time{
    font-size:25px;
    font-weight:bold;
    color:#2563eb;
    margin-top:5px;
}

.details-btn{
    background:#7c3aed;
    margin-top:15px;
}

.details{
    display:none;
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    border:1px solid #e5e7eb;
}

.details.show{
    display:block;
}

.detail-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
}

.detail{
    background:white;
    padding:12px;
    border-radius:8px;
    border:1px solid #e5e7eb;
}

.detail-title{
    font-size:12px;
    color:#6b7280;
}

.detail-value{
    font-weight:bold;
    margin-top:4px;
    word-break:break-word;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f8fafc;
}

.no-data{
    color:#6b7280;
    padding:10px 0;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .container{
        padding:12px;
    }

    .detail-row{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .stat{
        padding:15px;
    }

    .stat-value{
        font-size:22px;
    }

    th,td{
        font-size:13px;
        padding:8px;
    }

}

</style>

</head>


<body>


<div class="header">

    <h2>Office Attendance</h2>

    <p>Owner Dashboard</p>

</div>


<div class="container">


<!-- OWNER -->

<div class="card">

    <h2>
        Welcome, Owner
    </h2>

    <div id="ownerEmail">
        Loading...
    </div>

</div>


<!-- ADD EMPLOYEE -->

<div class="card">

    <h2>
        ➕ Add New Employee
    </h2>

    <p style="color:#6b7280;">
        नए employee का account यहाँ बनाएं।
    </p>


    <div id="addEmployeeMessage"></div>


    <div class="form-grid">

            </label>

            </select>

        id="addEmployeeBtn"
        onclick="addEmployee()">

        ➕ Add Employee

    </button>

</div>


<!-- STATS -->

<div class="stats">


<div class="stat">

    <div class="stat-title">
        Total Employees
    </div>

    <div
        id="totalEmployees"
        class="stat-value blue">

        0

    </div>

</div>


<div class="stat">

    <div class="stat-title">
        Currently IN
    </div>

    <div
        id="totalIn"
        class="stat-value green">

        0

    </div>

</div>


<div class="stat">

    <div class="stat-title">
        OUT
    </div>

    <div
        id="totalOut"
        class="stat-value red">

        0

    </div>

</div>


<div class="stat">

    <div class="stat-title">
        Total Working Time
    </div>

    <div
        id="totalWorking"
        class="stat-value orange">

        0h 0m

    </div>

</div>


</div>


<!-- DATE -->

<div class="card">

    <div class="date-box">

        <strong>
            Attendance Date:
        </strong>

        <input
            type="date"
            id="attendanceDate"
        >


        <button
            onclick="loadDashboard()">

            🔎 Search

        </button>


        <button
            class="refresh"

            🔄 Refresh

    </div>

</div>


<!-- MESSAGE -->

<div
    id="message"
    class="message">

    Attendance loading...

</div>


<!-- EMPLOYEES -->

<div class="card">

    <h2>
        👥 Employee Attendance
    </h2>

    <div id="employeeList">

        Loading...

    </div>

</div>


<button
    class="logout"
    onclick="logout()">

    Logout

</button>


</div>


<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   GLOBAL
===================================== */

let currentUser = null;

let employees = [];

let attendanceData = [];

let factories = [];


/* =====================================
   GET USER
===================================== */

async function getUser(){

    const result =
        await db.auth.getSession();


    if(result.error){

        showError(
            result.error.message
        );

        return null;
    }


    if(!result.data.session){

        window.location.href =
            "employee-login.html";

        return null;
    }


    currentUser =
        result.data.session.user;


    document.getElementById(
        "ownerEmail"
    ).innerText =
        currentUser.email;


    return currentUser;
}


/* =====================================
   LOAD FACTORIES
===================================== */

async function loadFactories(){

    const result =
        await db
        .from("factories")
        .select("*")
        .eq(
            "owner_id",
            currentUser.id
        )
        .eq(
            "status",
            "active"
        )
        .order(
            "name",
            {ascending:true}
        );


    if(result.error){

        console.error(
            result.error
        );

        return false;
    }


    factories =
        result.data || [];


    const select =
        document.getElementById(
            "newEmployeeFactory"
        );


    select.innerHTML = `

        <option value="">
            Factory select करें
        </option>

    `;


    factories.forEach(
        factory => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                factory.id;

            option.textContent =
                factory.name;

            select.appendChild(
                option
            );

        }
    );


    return true;
}


/* =====================================
   LOAD EMPLOYEES
===================================== */

async function loadEmployees(){

    const result =
        await db
        .from("employees")
        .select("*")
        .eq(
            "owner_id",
            currentUser.id
        )
        .order(
            "name",
            {ascending:true}
        );


    if(result.error){

        console.error(
            result.error
        );

        showError(
            "Employees load error: " +
            result.error.message
        );

        return false;
    }


    employees =
        result.data || [];


    document.getElementById(
        "totalEmployees"
    ).innerText =
        employees.length;


    return true;
}


/* =====================================
   ADD EMPLOYEE
===================================== */

async function addEmployee(){

    const name =
        document.getElementById(
            "newEmployeeName"
        ).value.trim();


    const phone =
        document.getElementById(
            "newEmployeePhone"
        ).value.trim();


    const email =
        document.getElementById(
            "newEmployeeEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "newEmployeePassword"
        ).value;


    const factoryId =
        document.getElementById(
            "newEmployeeFactory"
        ).value;


    const message =
        document.getElementById(
            "addEmployeeMessage"
        );


    const button =
        document.getElementById(
            "addEmployeeBtn"
        );


    if(!name){

        message.className =
            "message error";

        message.innerText =
            "Employee Name डालें।";

        return;
    }


    if(!phone){

        message.className =
            "message error";

        message.innerText =
            "Mobile Number डालें।";

        return;
    }


    if(!email){

        message.className =
            "message error";

        message.innerText =
            "Email डालें।";

        return;
    }


    if(!password){

        message.className =
            "message error";

        message.innerText =
            "Password डालें।";

        return;
    }


    if(password.length < 6){

        message.className =
            "message error";

        message.innerText =
            "Password कम से कम 6 characters का होना चाहिए।";

        return;
    }


    if(!factoryId){

        message.className =
            "message error";

        message.innerText =
            "Factory select करें।";

        return;
    }


    button.disabled = true;

    button.innerText =
        "⏳ Employee बनाया जा रहा है...";


    message.className =
        "message";

    message.innerText =
        "Employee account बनाया जा रहा है...";


    try{

        /*
          Existing Edge Function
          Actual endpoint:
          quick-endpoint
        */

        const result =
            await db.functions.invoke(
                "quick-endpoint",
                {
                    body:{
                        name:name,
                        phone:phone,
                        email:email,
                        password:password
                    }
                }
            );


        if(result.error){

            throw new Error(
                result.error.message ||
                "Employee create नहीं हुआ।"
            );
        }


        const response =
            result.data;


        if(
            !response ||
            response.success !== true
        ){

            throw new Error(
                response?.message ||
                "Employee create नहीं हुआ।"
            );
        }


        /*
          Employee record बनने के बाद
          factory_id attach करें
        */

        let employeeId = null;


        if(
            response.employee &&
            response.employee.id
        ){

            employeeId =
                response.employee.id;
        }


        if(employeeId){

            const updateResult =
                await db
                .from("employees")
                .update({
                    factory_id:
                        factoryId
                })
                .eq(
                    "id",
                    employeeId
                )
                .eq(
                    "owner_id",
                    currentUser.id
                );


            if(updateResult.error){

                console.error(
                    "Factory link error:",
                    updateResult.error
                );

            }

        }else{

            /*
              Fallback:
              email + owner_id से record खोजें
            */

            const updateResult =
                await db
                .from("employees")
                .update({
                    factory_id:
                        factoryId
                })
                .eq(
                    "email",
                    email
                )
                .eq(
                    "owner_id",
                    currentUser.id
                );


            if(updateResult.error){

                console.error(
                    "Factory link error:",
                    updateResult.error
                );

            }

        }


        message.className =
            "message success";


        message.innerHTML = `

            ✅ Employee successfully बनाया गया।

            <br><br>

            <b>Name:</b>
            ${escapeHtml(name)}

            <br>

            <b>Email:</b>
            ${escapeHtml(email)}

            <br>

            <b>Mobile:</b>
            ${escapeHtml(phone)}

        `;


        /*
          Form clear
        */

        document.getElementById(
            "newEmployeeName"
        ).value = "";


        document.getElementById(
            "newEmployeePhone"
        ).value = "";


        document.getElementById(
            "newEmployeeEmail"
        ).value = "";


        document.getElementById(
            "newEmployeePassword"
        ).value = "";


        document.getElementById(
            "newEmployeeFactory"
        ).value = "";


        /*
          Employee list reload
        */

        await loadEmployees();

        await loadDashboard();

    }

    catch(error){

        console.error(
            "ADD EMPLOYEE ERROR:",
            error
        );


        message.className =
            "message error";


        message.innerText =
            "❌ " +
            (
                error.message ||
                "Employee create नहीं हुआ।"
            );

    }

    finally{

        button.disabled = false;

        button.innerText =
            "➕ Add Employee";

    }

}


/* =====================================
   DATE
===================================== */

function setToday(){

    const d =
        new Date();


    const year =
        d.getFullYear();


    const month =
        String(
            d.getMonth()+1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "attendanceDate"
    ).value =
        year +
        "-" +
        month +
        "-" +
        day;

}


function getDateRange(){

    const value =
        document.getElementById(
            "attendanceDate"
        ).value;


    if(!value){

        return null;
    }


    const parts =
        value.split("-");


    const start =
        new Date(
            Number(parts[0]),
            Number(parts[1])-1,
            Number(parts[2]),
            0,0,0,0
        );


    const end =
        new Date(
            Number(parts[0]),
            Number(parts[1])-1,
            Number(parts[2])+1,
            0,0,0,0
        );


    return {

        start:
            start.toISOString(),

        end:
            end.toISOString()

    };

}


/* =====================================
   LOAD ATTENDANCE
===================================== */

async function loadAttendance(){

    attendanceData = [];


    if(
        employees.length === 0
    ){

        return true;
    }


    const range =
        getDateRange();


    if(!range){

        showError(
            "Attendance date select करें।"
        );

        return false;
    }


    const ids =
        employees.map(
            e => e.id
        );


    const result =
        await db
        .from("attendance")
        .select("*")
        .in(
            "employee_id",
            ids
        )
        .gte(
            "in_time",
            range.start
        )
        .lt(
            "in_time",
            range.end
        )
        .order(
            "in_time",
            {ascending:true}
        );


    if(result.error){

        showError(
            "Attendance load error: " +
            result.error.message
        );

        return false;
    }


    attendanceData =
        result.data || [];


    return true;
}


/* =====================================
   STATUS
===================================== */

function getStatus(rows){

    const open =
        [...rows]
        .reverse()
        .find(
            row =>
                !row.out_time
        );


    if(!open){

        return {
            type:"out",
            text:"🔴 OUT"
        };
    }


    if(open.outside_since){

        return {
            type:"away",
            text:"🟠 बाहर / Grace"
        };
    }


    return {
        type:"in",
        text:"🟢 IN"
    };
}


/* =====================================
   WORKING TIME
===================================== */

function getTotalMinutes(rows){

    let total = 0;


    rows.forEach(
        row => {

            if(row.out_time){

                total +=
                    Number(
                        row.working_minutes || 0
                    );

            }else if(row.in_time){

                const start =
                    new Date(
                        row.in_time
                    ).getTime();


                const live =
                    Math.floor(
                        (
                            Date.now() -
                            start
                        ) / 60000
                    );


                total +=
                    Math.max(
                        0,
                        live
                    );
            }

        }
    );


    return total;
}


function formatMinutes(minutes){

    minutes =
        Number(minutes) || 0;


    const h =
        Math.floor(
            minutes / 60
        );


    const m =
        minutes % 60;


    return h + "h " + m + "m";
}


function formatTime(value){

    if(!value){

        return "—";
    }


    return new Date(value)
        .toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );
}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   SESSIONS
===================================== */

function renderSessions(rows){

    if(!rows.length){

        return `

            <div class="no-data">

                आज कोई attendance session नहीं मिला।

            </div>

        `;
    }


    let html = `

        <div style="overflow-x:auto">

        <table>

        <thead>

        <tr>

            <th>#</th>

            <th>IN Time</th>

            <th>OUT Time</th>

            <th>Working</th>

            <th>Status</th>

        </tr>

        </thead>

        <tbody>

    `;


    rows.forEach(
        (row,index) => {

            let status =
                "Completed";


            if(!row.out_time){

                status =
                    row.outside_since
                    ? "🟠 Grace / Outside"
                    : "🟢 Running";

            }


            let working;


            if(row.out_time){

                working =
                    formatMinutes(
                        row.working_minutes
                    );

            }else{

                const live =
                    Math.floor(
                        (
                            Date.now() -
                            new Date(
                                row.in_time
                            ).getTime()
                        ) / 60000
                    );


                working =
                    formatMinutes(
                        Math.max(
                            0,
                            live
                        )
                    ) +
                    " (running)";

            }


            html += `

                <tr>

                    <td>
                        ${index+1}
                    </td>

                    <td>
                        ${formatTime(
                            row.in_time
                        )}
                    </td>

                    <td>
                        ${formatTime(
                            row.out_time
                        )}
                    </td>

                    <td>
                        ${working}
                    </td>

                    <td>
                        ${status}
                    </td>

                </tr>

            `;

        }
    );


    html += `

        </tbody>

        </table>

        </div>

    `;


    return html;
}


/* =====================================
   EMPLOYEE DETAILS
===================================== */

function toggleDetails(id){

    const box =
        document.getElementById(
            "details-" + id
        );


    if(!box){

        return;
    }


    if(
        box.style.display ===
        "block"
    ){

        box.style.display =
            "none";

    }else{

        box.style.display =
            "block";
    }

}

/* =====================================
   RENDER DASHBOARD
===================================== */

function renderDashboard(){

    const list =
        document.getElementById(
            "employeeList"
        );


    if(!employees.length){

        list.innerHTML = `

            <div class="no-data">

                इस Owner के लिए अभी कोई employee नहीं मिला।

            </div>

        `;


        document.getElementById(
            "totalEmployees"
        ).innerText = "0";


        document.getElementById(
            "totalIn"
        ).innerText = "0";


        document.getElementById(
            "totalOut"
        ).innerText = "0";


        document.getElementById(
            "totalWorking"
        ).innerText = "0h 0m";


        return;
    }


    let totalIn = 0;

    let totalOut = 0;

    let totalWorking = 0;

    let html = "";


    employees.forEach(
        employee => {

            const rows =
                attendanceData.filter(
                    row =>
                        row.employee_id ===
                        employee.id
                );


            const status =
                getStatus(rows);


            const minutes =
                getTotalMinutes(rows);


            totalWorking +=
                minutes;


            if(
                status.type === "in"
            ){

                totalIn++;

            }


            if(
                status.type === "out"
            ){

                totalOut++;

            }


            let badgeClass =
                "badge-out";


            if(
                status.type === "in"
            ){

                badgeClass =
                    "badge-in";

            }


            if(
                status.type === "away"
            ){

                badgeClass =
                    "badge-away";

            }


            html += `

                <div class="employee-card">


                    <div class="employee-header">


                        <div>

                            <div class="employee-name">

                                ${escapeHtml(
                                    employee.name ||
                                    "Employee"
                                )}

                            </div>


                            <div class="employee-info">

                                📧 ${
                                    escapeHtml(
                                        employee.email ||
                                        "—"
                                    )
                                }

                                <br>

                                📱 ${
                                    escapeHtml(
                                        employee.phone ||
                                        "—"
                                    )
                                }

                            </div>

                        </div>


                        <div
                            class="badge ${badgeClass}">

                            ${status.text}

                        </div>


                    </div>


                    <div class="total">

                        <div class="total-title">

                            आज का Total Working Time

                        </div>


                        <div class="total-time">

                            ${formatMinutes(
                                minutes
                            )}

                        </div>

                    </div>


                    <h3>
                        Today's Sessions
                    </h3>


                    ${renderSessions(rows)}


                    <button
                        class="details-btn"
                        onclick="toggleDetails('${employee.id}')">

                        👤 View Employee Details

                    </button>


                    ${employeeDetails(
                        employee,
                        rows,
                        status,
                        minutes
                    )}


                </div>

            `;

        }
    );


    list.innerHTML =
        html;


    document.getElementById(
        "totalEmployees"
    ).innerText =
        employees.length;


    document.getElementById(
        "totalIn"
    ).innerText =
        totalIn;


    document.getElementById(
        "totalOut"
    ).innerText =
        totalOut;


    document.getElementById(
        "totalWorking"
    ).innerText =
        formatMinutes(
            totalWorking
        );


    document.getElementById(
        "message"
    ).innerHTML = `

        Employees:
        <b>
            ${employees.length}
        </b>

        &nbsp; | &nbsp;

        Attendance Sessions:
        <b>
            ${attendanceData.length}
        </b>

    `;

}


/* =====================================
   ERROR
===================================== */

function showError(message){

    const box =
        document.getElementById(
            "message"
        );


    box.className =
        "message error";


    box.innerText =
        "❌ " + message;

}


/* =====================================
   LOAD DASHBOARD
===================================== */

async function loadDashboard(){

    if(!currentUser){

        return;
    }


    const success =
        await loadAttendance();


    if(!success){

        return;
    }


    renderDashboard();
}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await db.auth.signOut();


    window.location.href =
        "employee-login.html";

}


/* =====================================
   START APP
===================================== */

async function startApp(){

    setToday();


    const user =
        await getUser();


    if(!user){

        return;
    }


    /*
      Factories पहले load करें
    */

    await loadFactories();


    /*
      Employees load करें
    */

    const employeeSuccess =
        await loadEmployees();


    if(!employeeSuccess){

        return;
    }


    await loadDashboard();

}


/* =====================================
   AUTO REFRESH
===================================== */

setInterval(
    async function(){

        if(currentUser){

            await loadDashboard();

        }

    },
    30000
);


/* START */

startApp();

</script>
