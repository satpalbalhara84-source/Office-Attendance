<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Owner Attendance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f3f6fa;
color:#222;
}

.header{
background:#2563eb;
color:white;
padding:20px;
}

.header h2{
margin:0;
}

.header p{
margin:6px 0 0;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:14px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.stat{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.stat-title{
font-size:14px;
color:#666;
}

.stat-value{
font-size:30px;
font-weight:bold;
margin-top:8px;
}

.green{
color:#16a34a;
}

.red{
color:#dc2626;
}

.orange{
color:#d97706;
}

.blue{
color:#2563eb;
}

.controls{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

input,
button{
padding:11px 14px;
border-radius:8px;
border:1px solid #ddd;
font-size:15px;
}

button{
border:none;
cursor:pointer;
}

.searchBtn{
background:#2563eb;
color:white;
}

.refreshBtn{
background:#16a34a;
color:white;
}

.logoutBtn{
background:#dc2626;
color:white;
}

.employee{
border:1px solid #e1e5ea;
border-radius:12px;
padding:18px;
margin-bottom:15px;
}

.employee-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.employee-name{
font-size:21px;
font-weight:bold;
}

.badge{
padding:6px 10px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.badge-in{
background:#dcfce7;
color:#15803d;
}

.badge-out{
background:#fee2e2;
color:#b91c1c;
}

.badge-grace{
background:#fef3c7;
color:#92400e;
}

.info-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:15px;
}

.info{
background:#f8fafc;
padding:12px;
border-radius:8px;
}

.info small{
display:block;
color:#777;
margin-bottom:4px;
}

.sessions{
margin-top:15px;
}

.session{
background:#f8fafc;
padding:10px;
border-radius:8px;
margin-top:8px;
}

.no-data{
text-align:center;
padding:30px;
color:#777;
}

.message{
padding:12px;
border-radius:8px;
background:#eef4ff;
color:#2454b8;
margin-bottom:15px;
}

.error{
background:#fff0f0;
color:#b42318;
}

@media(max-width:800px){

.stats{
grid-template-columns:1fr 1fr;
}

.info-grid{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:500px){

.container{
padding:12px;
}

.stats{
grid-template-columns:1fr 1fr;
}

.info-grid{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<div class="header">

<h2>Office Attendance</h2>

<p>Owner Attendance Dashboard</p>

</div>


<div class="container">


<div class="card">

<h2 id="ownerName">
Loading...
</h2>

<p id="ownerEmail"></p>

<div id="message"
class="message">
Owner information load हो रही है...
</div>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-title">
Total Employees
</div>

<div id="totalEmployees"
class="stat-value blue">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Currently IN
</div>

<div id="currentlyIn"
class="stat-value green">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
OUT
</div>

<div id="currentlyOut"
class="stat-value red">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Total Working Time
</div>

<div id="totalWorking"
class="stat-value orange">
0h 0m
</div>

</div>

</div>


<br>


<!-- DATE -->

<div class="card">

<div class="controls">

<label>
<b>Attendance Date:</b>
</label>

<input
type="date"
id="attendanceDate">

<button
class="searchBtn"
onclick="loadDashboard()">
🔎 Search
</button>

<button
class="refreshBtn"
onclick="loadDashboard()">
🔄 Refresh
</button>

</div>

</div>


<!-- EMPLOYEES -->

<div class="card">

<h2>
👥 Employee Attendance
</h2>

<div id="employeeList">

Loading...

</div>

</div>


<button
class="logoutBtn"
onclick="logout()">

Logout

</button>


</div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let employees = [];

let attendance = [];


/* =========================================
   TODAY
========================================= */

function todayString(){

const d = new Date();

const y = d.getFullYear();

const m =
String(d.getMonth()+1)
.padStart(2,"0");

const day =
String(d.getDate())
.padStart(2,"0");

return `${y}-${m}-${day}`;

}


/* =========================================
   DATE RANGE
========================================= */

function getDateRange(dateString){

const parts =
dateString.split("-");

const year =
Number(parts[0]);

const month =
Number(parts[1])-1;

const day =
Number(parts[2]);


const start =
new Date(
year,
month,
day,
0,0,0,0
);


const end =
new Date(
year,
month,
day+1,
0,0,0,0
);


return {

start:start.toISOString(),

end:end.toISOString()

};

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(value){

if(!value){
return "—";
}

return new Date(value)
.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
}
);

}


/* =========================================
   FORMAT WORKING TIME
========================================= */

function formatMinutes(minutes){

minutes =
Math.max(
0,
Math.round(
Number(minutes)||0
)
);

const h =
Math.floor(minutes/60);

const m =
minutes%60;

return `${h}h ${m}m`;

}


/* =========================================
   GET CURRENT SESSION
========================================= */

async function getSession(){

const {
data,
error
} =
await db.auth.getSession();


if(
error ||
!data.session
){

window.location.href =
"index.html";

return null;

}


return data.session.user;

}


/* =========================================
   LOAD OWNER
========================================= */

async function loadOwner(){

if(!currentUser){
return false;
}


/*
   Owner का नाम auth metadata
   से लिया जा रहा है.
*/

const name =
currentUser.user_metadata?.full_name
||
currentUser.user_metadata?.name
||
"Owner";


document.getElementById(
"ownerName"
).innerText =
"Welcome, " + name;


document.getElementById(
"ownerEmail"
).innerText =
currentUser.email || "";


/*
   IMPORTANT:

   Owner को employees table में
   email से नहीं खोजना है.

   सीधे:

   employees.owner_id
   =
   logged in user.id
*/

const {
data,
error
} =
await db
.from("employees")
.select("*")
.eq(
"owner_id",
currentUser.id
)
.order(
"created_at",
{
ascending:true
}
);


if(error){

console.log(
"EMPLOYEE ERROR:",
error
);

showMessage(
"Employees load नहीं हुए: "
+ error.message,
true
);

return false;

}


employees =
data || [];


document.getElementById(
"totalEmployees"
).innerText =
employees.length;


return true;

}


/* =========================================
   LOAD ATTENDANCE
========================================= */

async function loadAttendance(){

const date =
document.getElementById(
"attendanceDate"
).value;


const range =
getDateRange(date);


/*
   सभी employees के IDs
*/

const ids =
employees.map(
e => e.id
);


if(ids.length === 0){

attendance = [];

return;

}


/*
   आज के सभी attendance sessions
*/

const {
data,
error
} =
await db
.from("attendance")
.select("*")
.in(
"employee_id",
ids
)
.gte(
"created_at",
range.start
)
.lt(
"created_at",
range.end
)
.order(
"in_time",
{
ascending:true
}
);


if(error){

console.log(
"ATTENDANCE ERROR:",
error
);

showMessage(
"Attendance load नहीं हुई: "
+ error.message,
true
);

return;

}


attendance =
data || [];

}


/* =========================================
   GROUP ATTENDANCE
========================================= */

function getEmployeeSessions(
employeeId
){

return attendance.filter(
a =>
String(a.employee_id)
===
String(employeeId)
);

}


/* =========================================
   CALCULATE EMPLOYEE TOTAL
========================================= */

function calculateEmployeeTotal(
sessions
){

let total = 0;

sessions.forEach(
session => {

if(
session.out_time
){

total +=
Number(
session.working_minutes
)||0;

}else{

const inTime =
new Date(
session.in_time
);

const now =
new Date();

const minutes =
Math.max(
0,
Math.round(
(now - inTime)/60000
)
);

total += minutes;

}

});

return total;

}


/* =========================================
   EMPLOYEE STATUS
========================================= */

function getEmployeeStatus(
sessions
){

/*
   Latest open session
*/

const open =
sessions
.filter(
s => !s.out_time
)
.pop();


if(open){

if(open.outside_since){

return {
type:"grace",
text:"🟠 Grace / बाहर"
};

}

return {
type:"in",
text:"🟢 IN"
};

}


return {
type:"out",
text:"🔴 OUT"
};

}


/* =========================================
   RENDER DASHBOARD
========================================= */

function renderDashboard(){

let currentlyIn = 0;

let currentlyOut = 0;

let totalWorkingMinutes = 0;


let html = "";


if(
employees.length === 0
){

html =
`
<div class="no-data">

कोई employee नहीं मिला।

</div>
`;

}


/*
   हर employee
*/

employees.forEach(
employee => {

const sessions =
getEmployeeSessions(
employee.id
);


const total =
calculateEmployeeTotal(
sessions
);


totalWorkingMinutes +=
total;


const status =
getEmployeeStatus(
sessions
);


if(
status.type === "in"
){

currentlyIn++;

}else{

currentlyOut++;

}


let badgeClass =
"badge-out";


if(
status.type === "in"
){

badgeClass =
"badge-in";

}

if(
status.type === "grace"
){

badgeClass =
"badge-grace";

}


/*
   Session HTML
*/

let sessionHTML = "";


if(
sessions.length === 0
){

sessionHTML =
`
<div class="session">
आज कोई attendance नहीं।
</div>
`;

}else{

sessions.forEach(
(session,index) => {

let working;

if(
session.out_time
){

working =
Number(
session.working_minutes
)||0;

}else{

const inTime =
new Date(
session.in_time
);

working =
Math.max(
0,
Math.round(
(new Date()-inTime)/60000
)
);

}


sessionHTML +=
`
<div class="session">

<b>
Session ${index+1}
</b>

<br>

IN:
${formatTime(session.in_time)}

<br>

OUT:
${formatTime(session.out_time)}

<br>

Working:
${formatMinutes(working)}

</div>
`;

});

}


/*
   Employee card
*/

html +=
`
<div class="employee">

<div class="employee-head">

<div class="employee-name">

${escapeHTML(
employee.name || "Employee"
)}

</div>

<div class="badge ${badgeClass}">

${status.text}

</div>

</div>


<div class="info-grid">

<div class="info">

<small>Email</small>

${escapeHTML(
employee.email || "—"
)}

</div>


<div class="info">

<small>Phone</small>

${escapeHTML(
employee.phone || "—"
)}

</div>


<div class="info">

<small>Today's Sessions</small>

${sessions.length}

</div>


<div class="info">

<small>Total Working Time</small>

<b>
${formatMinutes(total)}
</b>

</div>

</div>


<div class="sessions">

<b>
Attendance Sessions
</b>

${sessionHTML}

</div>

</div>
`;

});


document.getElementById(
"employeeList"
).innerHTML =
html;


document.getElementById(
"currentlyIn"
).innerText =
currentlyIn;


document.getElementById(
"currentlyOut"
).innerText =
currentlyOut;


document.getElementById(
"totalWorking"
).innerText =
formatMinutes(
totalWorkingMinutes
);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
text,
isError=false
){

const box =
document.getElementById(
"message"
);

box.innerText =
text;

box.className =
isError
?
"message error"
:
"message";

}


/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard(){

showMessage(
"Attendance load हो रही है..."
);

const ownerLoaded =
await loadOwner();


if(!ownerLoaded){

return;

}


await loadAttendance();


renderDashboard();


showMessage(
"Attendance successfully load हो गई ✅"
);

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

await db.auth.signOut();

window.location.href =
"index.html";

}


/* =========================================
   START
========================================= */

async function start(){

document.getElementById(
"attendanceDate"
).value =
todayString();


currentUser =
await getSession();


if(!currentUser){

return;

}


await loadDashboard();


/*
   हर 30 सेकंड में
   dashboard refresh
*/

setInterval(
async function(){

if(
document.visibilityState ===
"visible"
){

await loadDashboard();

}

},
30000
);

}


start();


</script>

</body>
</html>
