<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Owner Attendance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f6fa;
    color:#111827;
}

.header{
    background:#2563eb;
    color:white;
    padding:20px;
}

.header h2{
    margin:0;
}

.header p{
    margin:6px 0 0;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stats{
    display:grid;
    grid-template-columns:
    repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stat-title{
    color:#6b7280;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.blue{
    color:#2563eb;
}

.green{
    color:#16a34a;
}

.red{
    color:#dc2626;
}

.orange{
    color:#ea580c;
}

.date-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.date-box input{
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

button{
    padding:11px 18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    color:white;
    background:#2563eb;
    font-size:15px;
}

.refresh{
    background:#16a34a;
}

.logout{
    background:#dc2626;
}

.message{
    padding:12px;
    background:#eff6ff;
    border-radius:8px;
    margin-bottom:20px;
}

.employee-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
}

.employee-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.employee-name{
    font-size:21px;
    font-weight:bold;
}

.employee-info{
    color:#6b7280;
    margin-top:5px;
}

.badge{
    padding:7px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
}

.badge-in{
    background:#dcfce7;
    color:#166534;
}

.badge-out{
    background:#fee2e2;
    color:#991b1b;
}

.badge-away{
    background:#ffedd5;
    color:#9a3412;
}

.total{
    background:#eff6ff;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
}

.total-title{
    font-size:14px;
    color:#6b7280;
}

.total-time{
    font-size:25px;
    font-weight:bold;
    color:#2563eb;
    margin-top:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f8fafc;
}

.no-data{
    color:#6b7280;
    padding:10px 0;
}

.error{
    color:#b91c1c;
    background:#fee2e2;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:
        repeat(2,1fr);
    }

    .container{
        padding:12px;
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat-value{
        font-size:22px;
    }

    th,
    td{
        font-size:13px;
        padding:8px;
    }

}

</style>

</head>


<body>


<div class="header">

    <h2>Office Attendance</h2>

    <p>Owner Dashboard</p>

</div>


<div class="container">


<!-- OWNER -->

<div class="card">

    <h2>
        Welcome, Owner
    </h2>

    <div id="ownerEmail">
        Loading...
    </div>

</div>



<!-- STATS -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">
            Total Employees
        </div>

        <div
            id="totalEmployees"
            class="stat-value blue"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Currently IN
        </div>

        <div
            id="totalIn"
            class="stat-value green"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            OUT
        </div>

        <div
            id="totalOut"
            class="stat-value red"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Total Working Time
        </div>

        <div
            id="totalWorking"
            class="stat-value orange"
        >
            0h 0m
        </div>

    </div>

</div>



<!-- DATE -->

<div class="card">

    <div class="date-box">

        <strong>
            Attendance Date:
        </strong>

        <input
            type="date"
            id="attendanceDate"
        >

        <button
            onclick="loadDashboard()"
        >
            🔎 Search
        </button>

        <button
            class="refresh"
            onclick="loadDashboard()"
        >
            🔄 Refresh
        </button>

    </div>

</div>



<div
    id="message"
    class="message"
>
    Attendance loading...
</div>



<!-- EMPLOYEES -->

<div class="card">

    <h2>
        👥 Employee Attendance
    </h2>

    <div id="employeeList">

        Loading...

    </div>

</div>



<button
    class="logout"
    onclick="logout()"
>
    Logout
</button>


</div>



<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================
   GLOBAL
===================================== */

let currentUser = null;

let employees = [];

let attendanceData = [];



/* =====================================
   GET SESSION
===================================== */

async function getUser(){

    const {
        data,
        error
    } =
    await db.auth.getSession();


    if(
        error ||
        !data.session
    ){

        window.location.href =
            "employee-login.html";

        return null;

    }


    currentUser =
        data.session.user;


    document.getElementById(
        "ownerEmail"
    ).innerText =
        currentUser.email;


    return currentUser;

}



/* =====================================
   LOAD EMPLOYEES
===================================== */

async function loadEmployees(){

    const {
        data,
        error
    } =
    await db
        .from("employees")
        .select("*")
        .eq(
            "owner_id",
            currentUser.id
        )
        .order(
            "name",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        showError(
            "Employees load error: " +
            error.message
        );

        return false;

    }


    employees =
        data || [];


    document.getElementById(
        "totalEmployees"
    ).innerText =
        employees.length;


    return true;

}



/* =====================================
   DATE RANGE
===================================== */

function getDateRange(){

    const date =
        document.getElementById(
            "attendanceDate"
        ).value;


    const parts =
        date.split("-");


    const year =
        Number(parts[0]);

    const month =
        Number(parts[1])-1;

    const day =
        Number(parts[2]);


    const start =
        new Date(
            year,
            month,
            day,
            0,
            0,
            0,
            0
        );


    const end =
        new Date(
            year,
            month,
            day+1,
            0,
            0,
            0,
            0
        );


    return {

        start:
            start.toISOString(),

        end:
            end.toISOString()

    };

}



/* =====================================
   LOAD ATTENDANCE
===================================== */

async function loadAttendance(){

    attendanceData = [];


    if(
        employees.length === 0
    ){

        return true;

    }


    const range =
        getDateRange();


    const employeeIds =
        employees.map(
            employee =>
                employee.id
        );


    const {
        data,
        error
    } =
    await db
        .from("attendance")
        .select("*")
        .in(
            "employee_id",
            employeeIds
        )
        .gte(
            "created_at",
            range.start
        )
        .lt(
            "created_at",
            range.end
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "ATTENDANCE ERROR",
            error
        );


        showError(
            "Attendance load error: " +
            error.message
        );


        return false;

    }


    attendanceData =
        data || [];


    return true;

}



/* =====================================
   EMPLOYEE STATUS
===================================== */

function getStatus(rows){

    const open =
        [...rows]
            .reverse()
            .find(
                row =>
                    !row.out_time
            );


    if(!open){

        return {

            type:"out",

            text:"🔴 OUT"

        };

    }


    if(
        open.outside_since
    ){

        return {

            type:"away",

            text:"🟠 बाहर / Grace"

        };

    }


    return {

        type:"in",

        text:"🟢 IN"

    };

}



/* =====================================
   EMPLOYEE TOTAL
===================================== */

function getTotalMinutes(rows){

    let total = 0;


    rows.forEach(
        row => {

            /*
               Completed session
            */

            if(
                row.out_time
            ){

                total +=
                    Number(
                        row.working_minutes || 0
                    );

            }

            /*
               Current running session
            */

            else if(
                row.in_time
            ){

                const start =
                    new Date(
                        row.in_time
                    ).getTime();


                const live =
                    Math.floor(
                        (
                            Date.now() -
                            start
                        ) / 60000
                    );


                total +=
                    Math.max(
                        0,
                        live
                    );

            }

        }
    );


    return total;

}



/* =====================================
   FORMAT MINUTES
===================================== */

function formatMinutes(
    minutes
){

    minutes =
        Number(minutes) || 0;


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        hours +
        "h " +
        mins +
        "m"
    );

}



/* =====================================
   FORMAT TIME
===================================== */

function formatTime(
    value
){

    if(!value){

        return "—";

    }


    return new Date(value)
        .toLocaleTimeString(
            "en-IN",
            {

                hour:"2-digit",

                minute:"2-digit",

                second:"2-digit"

            }
        );

}



/* =====================================
   RENDER SESSIONS
===================================== */

function renderSessions(rows){

    if(
        rows.length === 0
    ){

        return `
            <div class="no-data">
                आज कोई attendance नहीं।
            </div>
        `;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        Session
                    </th>

                    <th>
                        IN
                    </th>

                    <th>
                        OUT
                    </th>

                    <th>
                        Working
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    rows.forEach(
        (row,index) => {

            let working;


            if(
                row.out_time
            ){

                working =
                    formatMinutes(
                        row.working_minutes
                    );

            }

            else{

                const live =
                    Math.floor(
                        (
                            Date.now() -
                            new Date(
                                row.in_time
                            ).getTime()
                        ) / 60000
                    );


                working =
                    formatMinutes(
                        Math.max(
                            0,
                            live
                        )
                    );

            }


            html += `

                <tr>

                    <td>
                        ${index+1}
                    </td>

                    <td>
                        ${formatTime(
                            row.in_time
                        )}
                    </td>

                    <td>
                        ${
                            row.out_time
                            ?
                            formatTime(
                                row.out_time
                            )
                            :
                            "Working"
                        }
                    </td>

                    <td>
                        ${working}
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    return html;

}



/* =====================================
   RENDER
===================================== */

function renderDashboard(){

    const box =
        document.getElementById(
            "employeeList"
        );


    if(
        employees.length === 0
    ){

        box.innerHTML =
            `
            <div class="no-data">
                कोई employee नहीं मिला।
            </div>
            `;

        document.getElementById(
            "totalIn"
        ).innerText = 0;

        document.getElementById(
            "totalOut"
        ).innerText = 0;

        document.getElementById(
            "totalWorking"
        ).innerText =
            "0h 0m";

        return;

    }


    let totalIn = 0;

    let totalOut = 0;

    let companyTotal = 0;


    let html = "";


    employees.forEach(
        employee => {

            const rows =
                attendanceData.filter(
                    row =>
                        row.employee_id ===
                        employee.id
                );


            const status =
                getStatus(rows);


            const total =
                getTotalMinutes(
                    rows
                );


            companyTotal +=
                total;


            if(
                status.type === "in"
            ){

                totalIn++;

            }

            else{

                totalOut++;

            }


            html += `

            <div class="employee-card">

                <div class="employee-header">

                    <div>

                        <div class="employee-name">

                            ${escapeHtml(
                                employee.name ||
                                "Employee"
                            )}

                        </div>

                        <div class="employee-info">

                            Email:
                            ${escapeHtml(
                                employee.email ||
                                "—"
                            )}

                        </div>

                        <div class="employee-info">

                            Phone:
                            ${escapeHtml(
                                employee.phone ||
                                "—"
                            )}

                        </div>

                    </div>


                    <span
                        class="badge badge-${status.type}"
                    >

                        ${status.text}

                    </span>

                </div>


                <div class="total">

                    <div class="total-title">

                        Today's Total Working Time

                    </div>

                    <div class="total-time">

                        ${formatMinutes(
                            total
                        )}

                    </div>

                </div>


                <h3>
                    📋 Attendance Sessions
                </h3>


                ${renderSessions(
                    rows
                )}

            </div>

            `;

        }
    );


    box.innerHTML =
        html;


    document.getElementById(
        "totalIn"
    ).innerText =
        totalIn;


    document.getElementById(
        "totalOut"
    ).innerText =
        totalOut;


    document.getElementById(
        "totalWorking"
    ).innerText =
        formatMinutes(
            companyTotal
        );


    document.getElementById(
        "message"
    ).innerText =
        "Attendance successfully load हो गई ✅";

}



/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================
   ERROR
===================================== */

function showError(
    message
){

    document.getElementById(
        "message"
    ).innerText =
        message;


    document.getElementById(
        "message"
    ).className =
        "message error";

}



/* =====================================
   LOAD DASHBOARD
===================================== */

async function loadDashboard(){

    document.getElementById(
        "message"
    ).innerText =
        "Attendance loading...";


    const ok =
        await loadAttendance();


    if(!ok){

        return;

    }


    renderDashboard();

}



/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await db.auth.signOut();

    window.location.href =
        "employee-login.html";

}



/* =====================================
   START
===================================== */

async function startApp(){

    const user =
        await getUser();


    if(!user){

        return;

    }


    const employeeOK =
        await loadEmployees();


    if(!employeeOK){

        return;

    }


    const today =
        new Date();


    const yyyy =
        today.getFullYear();


    const mm =
        String(
            today.getMonth()+1
        ).padStart(
            2,
            "0"
        );


    const dd =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "attendanceDate"
    ).value =
        yyyy +
        "-" +
        mm +
        "-" +
        dd;


    await loadDashboard();


    /*
       हर 30 second में
       total/status update
    */

    setInterval(
        loadDashboard,
        30000
    );

}


startApp();


</script>

</body>

</html>
