<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Owner Attendance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f6fa;
    color:#111827;
}

.header{
    background:#2563eb;
    color:white;
    padding:20px;
}

.header h2{
    margin:0;
}

.header p{
    margin:6px 0 0;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stat-title{
    color:#6b7280;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.blue{
    color:#2563eb;
}

.green{
    color:#16a34a;
}

.red{
    color:#dc2626;
}

.orange{
    color:#ea580c;
}

.date-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.date-box input{
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

button{
    padding:11px 18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    color:white;
    background:#2563eb;
    font-size:15px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.refresh{
    background:#16a34a;
}

.logout{
    background:#dc2626;
    width:100%;
    margin-top:10px;
}

.message{
    padding:12px;
    background:#eff6ff;
    border-radius:8px;
    margin-bottom:20px;
}

.employee-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
}

.employee-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.employee-name{
    font-size:21px;
    font-weight:bold;
}

.employee-info{
    color:#6b7280;
    margin-top:5px;
    line-height:1.7;
}

.badge{
    padding:7px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
}

.badge-in{
    background:#dcfce7;
    color:#166534;
}

.badge-out{
    background:#fee2e2;
    color:#991b1b;
}

.badge-away{
    background:#ffedd5;
    color:#9a3412;
}

.total{
    background:#eff6ff;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
}

.total-title{
    font-size:14px;
    color:#6b7280;
}

.total-time{
    font-size:25px;
    font-weight:bold;
    color:#2563eb;
    margin-top:5px;
}

.view-details{
    background:#7c3aed;
    margin-top:12px;
}

.details-box{
    display:none;
    margin-top:15px;
    padding:18px;
    background:#f8fafc;
    border-radius:12px;
    border:1px solid #e5e7eb;
}

.details-box.show{
    display:block;
}

.details-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.detail-item{
    background:white;
    padding:12px;
    border-radius:8px;
    border:1px solid #e5e7eb;
}

.detail-label{
    font-size:12px;
    color:#6b7280;
    margin-bottom:5px;
}

.detail-value{
    font-weight:bold;
    word-break:break-word;
}

.close-details{
    background:#6b7280;
    margin-top:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f8fafc;
}

.no-data{
    color:#6b7280;
    padding:10px 0;
}

.error{
    color:#b91c1c;
    background:#fee2e2;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .container{
        padding:12px;
    }

    .details-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat-value{
        font-size:22px;
    }

    th,
    td{
        font-size:13px;
        padding:8px;
    }

    .employee-card{
        padding:14px;
    }

}

</style>

</head>


<body>


<div class="header">

    <h2>Office Attendance</h2>

    <p>Owner Dashboard</p>

</div>


<div class="container">


<!-- OWNER -->

<div class="card">

    <h2>
        Welcome, Owner
    </h2>

    <div id="ownerEmail">
        Loading...
    </div>

</div>


<!-- STATS -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">
            Total Employees
        </div>

        <div
            id="totalEmployees"
            class="stat-value blue">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Currently IN
        </div>

        <div
            id="totalIn"
            class="stat-value green">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            OUT
        </div>

        <div
            id="totalOut"
            class="stat-value red">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Total Working Time
        </div>

        <div
            id="totalWorking"
            class="stat-value orange">

            0h 0m

        </div>

    </div>


</div>


<!-- DATE -->

<div class="card">

    <div class="date-box">

        <strong>
            Attendance Date:
        </strong>

        <input
            type="date"
            id="attendanceDate"
        >

        <button
            onclick="loadDashboard()">

            🔎 Search

        </button>


        <button
            class="refresh"
            onclick="loadDashboard()">

            🔄 Refresh

        </button>

    </div>

</div>


<!-- MESSAGE -->

<div
    id="message"
    class="message">

    Attendance loading...

</div>


<!-- EMPLOYEES -->

<div class="card">

    <h2>
        👥 Employee Attendance
    </h2>

    <div id="employeeList">

        Loading...

    </div>

</div>


<button
    class="logout"
    onclick="logout()">

    Logout

</button>


</div>


<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   GLOBAL
===================================== */

let currentUser = null;

let employees = [];

let attendanceData = [];


/* =====================================
   GET SESSION
===================================== */

async function getUser(){

    const {
        data,
        error
    } =
    await db.auth.getSession();


    if(
        error ||
        !data.session
    ){

        window.location.href =
            "employee-login.html";

        return null;
    }


    currentUser =
        data.session.user;


    document.getElementById(
        "ownerEmail"
    ).innerText =
        currentUser.email;


    return currentUser;

}


/* =====================================
   LOAD EMPLOYEES
===================================== */

async function loadEmployees(){

    const {
        data,
        error
    } =
    await db
        .from("employees")
        .select("*")
        .eq(
            "owner_id",
            currentUser.id
        )
        .order(
            "name",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        showError(
            "Employees load error: " +
            error.message
        );

        return false;
    }


    employees =
        data || [];


    document.getElementById(
        "totalEmployees"
    ).innerText =
        employees.length;


    return true;

}


/* =====================================
   GET SELECTED DATE
===================================== */

function getSelectedDate(){

    const value =
        document.getElementById(
            "attendanceDate"
        ).value;


    if(!value){

        return null;

    }


    const parts =
        value.split("-");


    return {

        year:
            Number(parts[0]),

        month:
            Number(parts[1]) - 1,

        day:
            Number(parts[2])

    };

}


/* =====================================
   DATE RANGE
===================================== */

function getDateRange(){

    const selected =
        getSelectedDate();


    if(!selected){

        return null;

    }


    const start =
        new Date(
            selected.year,
            selected.month,
            selected.day,
            0,
            0,
            0,
            0
        );


    const end =
        new Date(
            selected.year,
            selected.month,
            selected.day + 1,
            0,
            0,
            0,
            0
        );


    return {

        start:
            start.toISOString(),

        end:
            end.toISOString()

    };

}


/* =====================================
   LOAD ATTENDANCE
===================================== */

async function loadAttendance(){

    attendanceData = [];


    if(
        employees.length === 0
    ){

        return true;

    }


    const range =
        getDateRange();


    if(!range){

        showError(
            "Attendance date select करें।"
        );

        return false;

    }


    const employeeIds =
        employees.map(
            employee =>
                employee.id
        );


    const {
        data,
        error
    } =
    await db
        .from("attendance")
        .select("*")
        .in(
            "employee_id",
            employeeIds
        )
        .gte(
            "in_time",
            range.start
        )
        .lt(
            "in_time",
            range.end
        )
        .order(
            "in_time",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "ATTENDANCE ERROR",
            error
        );


        showError(
            "Attendance load error: " +
            error.message
        );


        return false;

    }


    attendanceData =
        data || [];


    return true;

}


/* =====================================
   EMPLOYEE STATUS
===================================== */

function getStatus(rows){

    const open =
        [...rows]
            .reverse()
            .find(
                row =>
                    !row.out_time
            );


    if(!open){

        return {

            type:"out",

            text:"🔴 OUT"

        };

    }


    if(
        open.outside_since
    ){

        return {

            type:"away",

            text:"🟠 बाहर / Grace"

        };

    }


    return {

        type:"in",

        text:"🟢 IN"

    };

}


/* =====================================
   TOTAL MINUTES
===================================== */

function getTotalMinutes(rows){

    let total = 0;


    rows.forEach(
        row => {


            if(
                row.out_time
            ){

                total +=
                    Number(
                        row.working_minutes || 0
                    );

            }


            else if(
                row.in_time
            ){

                const start =
                    new Date(
                        row.in_time
                    ).getTime();


                const live =
                    Math.floor(
                        (
                            Date.now() -
                            start
                        ) / 60000
                    );


                total +=
                    Math.max(
                        0,
                        live
                    );

            }

        }
    );


    return total;

}


/* =====================================
   FORMAT MINUTES
===================================== */

function formatMinutes(
    minutes
){

    minutes =
        Number(minutes) || 0;


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        hours +
        "h " +
        mins +
        "m"
    );

}


/* =====================================
   FORMAT TIME
===================================== */

function formatTime(
    value
){

    if(!value){

        return "—";

    }


    return new Date(value)
        .toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
    value
){

    if(!value){

        return "—";

    }


    return new Date(value)
        .toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   RENDER SESSIONS
===================================== */

function renderSessions(rows){

    if(!rows || rows.length === 0){

        return `
            <div class="no-data">
                आज कोई attendance session नहीं मिला।
            </div>
        `;

    }


    let html = `

        <div style="overflow-x:auto">

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>IN Time</th>

                    <th>OUT Time</th>

                    <th>Working</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

    `;


    rows.forEach(
        (row,index) => {

            let status = "Completed";


            if(!row.out_time){

                if(row.outside_since){

                    status =
                        "🟠 Grace / Outside";

                }else{

                    status =
                        "🟢 Running";

                }

            }


            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${formatTime(
                            row.in_time
                        )}
                    </td>

                    <td>
                        ${formatTime(
                            row.out_time
                        )}
                    </td>

                    <td>
                        ${
                            row.out_time
                            ? formatMinutes(
                                row.working_minutes
                              )
                            : formatMinutes(
                                Math.max(
                                    0,
                                    Math.floor(
                                        (
                                            Date.now() -
                                            new Date(
                                                row.in_time
                                            ).getTime()
                                        ) / 60000
                                    )
                                )
                              ) + " (running)"
                        }
                    </td>

                    <td>
                        ${status}
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

        </div>

    `;


    return html;

}


/* =====================================
   EMPLOYEE DETAILS
===================================== */

function getEmployeeDetails(
    employee,
    rows,
    status,
    minutes
){

    const factoryId =
        employee.factory_id ||
        "—";

    const ownerId =
        employee.owner_id ||
        "—";

    const employeeId =
        employee.id ||
        "—";


    return `

        <div
            id="details-${employee.id}"
            class="details-box">

            <h3>
                👤 Employee Details
            </h3>

            <div class="details-grid">

                <div class="detail-item">

                    <div class="detail-label">
                        Employee Name
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            employee.name || "—"
                        )}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Employee ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            employeeId
                        )}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Mobile
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            employee.phone || "—"
                        )}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Email
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            employee.email || "—"
                        )}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Factory ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            factoryId
                        )}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Owner ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            ownerId
                        )}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Selected Date
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            document.getElementById(
                                "attendanceDate"
                            ).value || "—"
                        )}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Current Status
                    </div>

                    <div class="detail-value">
                        ${status.text}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Total Sessions
                    </div>

                    <div class="detail-value">
                        ${rows.length}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Total Working Time
                    </div>

                    <div class="detail-value">
                        ${formatMinutes(
                            minutes
                        )}
                    </div>

                </div>

            </div>


            <h3>
                📋 Attendance Sessions
            </h3>

            ${renderSessions(rows)}


            <button
                class="close-details"
                onclick="toggleEmployeeDetails('${employee.id}')">

                ▲ Close Details

            </button>

        </div>

    `;

}


/* =====================================
   TOGGLE EMPLOYEE DETAILS
===================================== */

function toggleEmployeeDetails(
    employeeId
){

    const box =
        document.getElementById(
            "details-" + employeeId
        );


    if(!box){

        return;

    }


    box.classList.toggle(
        "show"
    );

}


/* =====================================
   RENDER DASHBOARD
===================================== */

function renderDashboard(){

    const list =
        document.getElementById(
            "employeeList"
        );


    if(
        employees.length === 0
    ){

        list.innerHTML = `

            <div class="no-data">

                इस Owner के लिए अभी कोई employee नहीं मिला।

            </div>

        `;


        document.getElementById(
            "totalEmployees"
        ).innerText = "0";


        document.getElementById(
            "totalIn"
        ).innerText = "0";


        document.getElementById(
            "totalOut"
        ).innerText = "0";


        document.getElementById(
            "totalWorking"
        ).innerText = "0h 0m";


        return;

    }


    let totalIn = 0;

    let totalOut = 0;

    let totalWorking = 0;


    let html = "";


    employees.forEach(
        employee => {


            const rows =
                attendanceData.filter(
                    row =>
                        row.employee_id ===
                        employee.id
                );


            const status =
                getStatus(rows);


            const minutes =
                getTotalMinutes(rows);


            totalWorking +=
                minutes;


            if(
                status.type === "in"
            ){

                totalIn++;

            }


            else if(
                status.type === "out"
            ){

                totalOut++;

            }


            let badgeClass =
                "badge-out";


            if(
                status.type === "in"
            ){

                badgeClass =
                    "badge-in";

            }


            if(
                status.type === "away"
            ){

                badgeClass =
                    "badge-away";

            }


            html += `

                <div class="employee-card">


                    <div class="employee-header">


                        <div>

                            <div class="employee-name">

                                ${escapeHtml(
                                    employee.name ||
                                    "Employee"
                                )}

                            </div>


                            <div class="employee-info">

                                📧 ${
                                    escapeHtml(
                                        employee.email ||
                                        "—"
                                    )
                                }

                                <br>

                                📱 ${
                                    escapeHtml(
                                        employee.phone ||
                                        "—"
                                    )
                                }

                            </div>

                        </div>


                        <div
                            class="badge ${badgeClass}">

                            ${status.text}

                        </div>


                    </div>


                    <div class="total">

                        <div class="total-title">

                            आज का Total Working Time

                        </div>

                        <div class="total-time">

                            ${formatMinutes(
                                minutes
                            )}

                        </div>

                    </div>


                    <h3>
                        Today's Sessions
                    </h3>


                    ${
                        renderSessions(
                            rows
                        )
                    }


                    <button
                        class="view-details"
                        onclick="toggleEmployeeDetails('${employee.id}')">

                        👤 View Employee Details

                    </button>


                    ${
                        getEmployeeDetails(
                            employee,
                            rows,
                            status,
                            minutes
                        )
                    }


                </div>

            `;

        }
    );


    list.innerHTML =
        html;


    document.getElementById(
        "totalEmployees"
    ).innerText =
        employees.length;


    document.getElementById(
        "totalIn"
    ).innerText =
        totalIn;


    document.getElementById(
        "totalOut"
    ).innerText =
        totalOut;


    document.getElementById(
        "totalWorking"
    ).innerText =
        formatMinutes(
            totalWorking
        );


    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message";


    message.innerHTML = `

        Employees:
        <b>
            ${employees.length}
        </b>

        &nbsp; | &nbsp;

        Attendance Sessions:
        <b>
            ${attendanceData.length}
        </b>

    `;

}


/* =====================================
   ERROR MESSAGE
===================================== */

function showError(
    message
){

    const box =
        document.getElementById(
            "message"
        );


    box.className =
        "message error";


    box.innerHTML =
        "❌ " +
        escapeHtml(
            message
        );

}


/* =====================================
   LOAD DASHBOARD
===================================== */

async function loadDashboard(){

    if(!currentUser){

        return;

    }


    const button =
        document.querySelector(
            'button[onclick="loadDashboard()"]'
        );


    try{

        if(button){

            button.disabled = true;

        }


        const success =
            await loadAttendance();


        if(!success){

            return;

        }


        renderDashboard();

    }

    catch(error){

        console.error(error);


        showError(
            error.message ||
            "Dashboard load नहीं हो पाया।"
        );

    }

    finally{

        if(button){

            button.disabled = false;

        }

    }

}


/* =====================================
   SET TODAY DATE
===================================== */

function setToday(){

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "attendanceDate"
    ).value =
        `${year}-${month}-${day}`;

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await db.auth.signOut();


    window.location.href =
        "employee-login.html";

}


/* =====================================
   START APP
===================================== */

async function startApp(){

    setToday();


    const user =
        await getUser();


    if(!user){

        return;

    }


    const employeeSuccess =
        await loadEmployees();


    if(!employeeSuccess){

        return;

    }


    await loadDashboard();

}


/* =====================================
   AUTO REFRESH
===================================== */

setInterval(
    async function(){

        if(currentUser){

            await loadDashboard();

        }

    },
    30000
);


/* =====================================
   START
===================================== */

startApp();

</script>
