<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Owner Dashboard - Office Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f6fa;color:#111827}
header{background:#2563eb;color:white;padding:18px}
.header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0}
header p{margin:5px 0 0}
.container{max-width:1200px;margin:25px auto;padding:0 15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:15px}
.blue{background:#2563eb;color:white}
.red{background:#dc2626;color:white}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.stat{background:white;padding:20px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.stat h3{margin:0;font-size:28px;color:#2563eb}
.stat p{margin:6px 0;color:#6b7280}
.employees{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.emp{border:1px solid #e5e7eb;border-radius:12px;padding:18px}
.emp h3{margin:0 0 10px}
.emp p{margin:7px 0}
.badge{display:inline-block;padding:6px 13px;border-radius:20px;font-weight:bold}
.in{background:#dcfce7;color:#166534}
.out{background:#fee2e2;color:#991b1b}
.msg{display:none;padding:12px;margin-top:12px;border-radius:8px}
.ok{display:block;background:#dcfce7;color:#166534}
.err{display:block;background:#fee2e2;color:#991b1b}
@media(max-width:800px){
.stats{grid-template-columns:1fr 1fr}
.employees{grid-template-columns:1fr}
}
@media(max-width:600px){
.grid{grid-template-columns:1fr}
.header{align-items:flex-start}
}
</style>
</head>

<body>

<header>
<div class="header">
<div>
<h1>Office Attendance</h1>
<p>Owner Dashboard</p>
</div>
<button class="red" onclick="logout()">Logout</button>
</div>
</header>

<div class="container">

<!-- OWNER -->
<div class="card">
<h2>👤 Owner</h2>
<div id="ownerInfo">Loading...</div>
</div>

<!-- ADD EMPLOYEE -->
<div class="card">
<h2>➕ Add New Employee</h2>

<div class="grid">

<div>
<label>Employee Name</label>
<input id="name" placeholder="Employee Name">
</div>

<div>
<label>Mobile Number</label>
<input id="phone" placeholder="Mobile Number">
</div>

<div>
<label>Employee Email</label>
<input id="email" type="email" placeholder="employee@gmail.com">
</div>

<div>
<label>Password</label>
<input id="password" type="password" placeholder="Password">
</div>

<div>
<label>Factory</label>
<select id="factory">
<option value="">Factory चुनें</option>
</select>
</div>

</div>

<button
id="addBtn"
class="blue"
style="margin-top:15px"
onclick="addEmployee()">
Add Employee
</button>

<div id="msg" class="msg"></div>
</div>

<!-- STATS -->
<div class="stats">

<div class="stat">
<h3 id="total">0</h3>
<p>Total Employees</p>
</div>

<div class="stat">
<h3 id="inCount">0</h3>
<p>Currently IN</p>
</div>

<div class="stat">
<h3 id="outCount">0</h3>
<p>Currently OUT</p>
</div>

<div class="stat">
<h3 id="working">0h 0m</h3>
<p>Today's Working</p>
</div>

</div>

<!-- EMPLOYEES -->
<div class="card">
<h2>👥 Employees</h2>
<div id="list" class="employees">
Loading...
</div>
</div>

</div>

<script>

/* ==============================
   SUPABASE
============================== */

const URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";

const KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";

const db =
supabase.createClient(URL,KEY);

let user=null;
let employees=[];
let factories=[];


/* ==============================
   START
============================== */

window.onload=init;


async function init(){

    const {data} =
    await db.auth.getSession();

    if(!data.session){

        location.href="owner-login.html";
        return;

    }

    user=data.session.user;

    document.getElementById("ownerInfo").innerHTML=
    `
    <b>Email:</b> ${safe(user.email)}
    <br><br>
    <b>Owner ID:</b> ${safe(user.id)}
    `;

    await loadFactories();
    await loadEmployees();
}


/* ==============================
   FACTORIES
============================== */

async function loadFactories(){

    const {data,error} =
    await db
    .from("factories")
    .select("*")
    .eq("owner_id",user.id)
    .order("created_at",{ascending:false});

    if(error){

        console.error(error);
        return;

    }

    factories=data||[];

    const select=
    document.getElementById("factory");

    select.innerHTML=
    `<option value="">Factory चुनें</option>`;

    factories.forEach(f=>{

        select.innerHTML+=
        `<option value="${f.id}">
        ${safe(f.name)}
        </option>`;

    });

    if(factories.length===1){

        select.value=factories[0].id;

    }
}


/* ==============================
   EMPLOYEES
============================== */

async function loadEmployees(){

    const {data,error} =
    await db
    .from("employees")
    .select("*")
    .eq("owner_id",user.id)
    .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        document.getElementById("list").innerHTML=
        "Employee load error: "+safe(error.message);

        return;

    }

    employees=data||[];

    document.getElementById("total").innerText=
    employees.length;

    await render();

}


/* ==============================
   TODAY
============================== */

function today(){

    const d=new Date();

    return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");

}


/* ==============================
   ATTENDANCE
============================== */

async function attendance(employeeId){

    const {data,error} =
    await db
    .from("attendance")
    .select("*")
    .eq("employee_id",employeeId)
    .eq("date",today())
    .order("check_in",{ascending:false});

    if(error){

        console.error(error);
        return [];

    }

    return data||[];

}


/* ==============================
   CURRENT STATUS
============================== */

function currentStatus(rows){

    if(!rows.length)
        return "OUT";


    /*
       सबसे पहले latest record देखें।

       अगर status = IN है
       तो Owner में IN दिखाएँ।

       अगर status = OUT है
       तो Owner में OUT दिखाएँ।
    */

    for(const row of rows){

        if(row.status){

            const s=
            String(row.status).trim().toUpperCase();

            if(s==="IN")
                return "IN";

            if(s==="OUT")
                return "OUT";

        }

    }


    /*
       अगर status खाली है,
       check_in/check_out से पता लगाएँ।
    */

    const latest=rows[0];

    if(
        latest.check_in &&
        !latest.check_out
    ){

        return "IN";

    }

    return "OUT";

}


/* ==============================
   WORKING TIME
============================== */

function workingTime(rows){

    let total=0;

    rows.forEach(row=>{

        if(!row.check_in)
            return;

        const start=
        new Date(row.check_in);

        const end=
        row.check_out
        ? new Date(row.check_out)
        : new Date();

        if(end>start){

            total+=
            Math.floor(
                (end-start)/60000
            );

        }

    });

    return total;

}


/* ==============================
   RENDER
============================== */

async function render(){

    const list=
    document.getElementById("list");

    if(!employees.length){

        list.innerHTML=
        "<div>अभी कोई employee नहीं है।</div>";

        document.getElementById("inCount").innerText=0;
        document.getElementById("outCount").innerText=0;
        document.getElementById("working").innerText="0h 0m";

        return;

    }

    let html="";
    let ins=0;
    let outs=0;
    let totalMinutes=0;


    for(const emp of employees){

        const rows=
        await attendance(emp.id);

        const status=
        currentStatus(rows);

        const minutes=
        workingTime(rows);

        totalMinutes+=minutes;

        if(status==="IN")
            ins++;
        else
            outs++;


        let factoryName="-";

        const factory=
        factories.find(
            f=>f.id===emp.factory_id
        );

        if(factory)
            factoryName=factory.name;


        html+=`

        <div class="emp">

            <h3>
            👤 ${safe(emp.name||"Employee")}
            </h3>

            <p>
            📱 ${safe(emp.phone||"-")}
            </p>

            <p>
            ✉️ ${safe(emp.email||"-")}
            </p>

            <p>
            🏭 ${safe(factoryName)}
            </p>

            <p>
            Status:

            <span class="badge ${
                status==="IN"
                ?"in"
                :"out"
            }">

            ${status}

            </span>
            </p>

            <p>
            ⏱️ Today's Working:
            <b>${format(minutes)}</b>
            </p>

            <button
            class="blue"
            onclick="details('${emp.id}')">
            View Details
            </button>

        </div>

        `;

    }


    list.innerHTML=html;

    document.getElementById("inCount").innerText=ins;

    document.getElementById("outCount").innerText=outs;

    document.getElementById("working").innerText=
    format(totalMinutes);

}


/* ==============================
   ADD EMPLOYEE
============================== */

async function addEmployee(){

    const name=
    document.getElementById("name").value.trim();

    const phone=
    document.getElementById("phone").value.trim();

    const email=
    document.getElementById("email").value.trim();

    const password=
    document.getElementById("password").value;

    const factoryId=
    document.getElementById("factory").value;

    if(!name||
       !phone||
       !email||
       !password||
       !factoryId){

        message(
        "सभी जानकारी भरें और Factory चुनें।",
        false
        );

        return;

    }


    if(password.length<6){

        message(
        "Password कम से कम 6 characters का होना चाहिए।",
        false
        );

        return;

    }


    const btn=
    document.getElementById("addBtn");

    btn.disabled=true;

    btn.innerText=
    "Employee बन रहा है...";


    try{

        const {data,error}=
        await db.functions.invoke(
        "quick-endpoint",
        {
            body:{
                name:name,
                phone:phone,
                email:email,
                password:password
            }
        });


        if(error)
            throw error;


        await new Promise(
        r=>setTimeout(r,1000)
        );


        /*
          Created employee खोजें
        */

        const {data:emp,error:findError}=
        await db
        .from("employees")
        .select("id,email,owner_id")
        .eq("email",email)
        .eq("owner_id",user.id)
        .limit(1);


        if(findError)
            throw findError;


        if(emp && emp.length){

            const {error:updateError}=
            await db
            .from("employees")
            .update({
                factory_id:factoryId
            })
            .eq("id",emp[0].id)
            .eq("owner_id",user.id);


            if(updateError)
                throw updateError;

        }


        message(
        "Employee सफलतापूर्वक बन गया ✅",
        true
        );


        document.getElementById("name").value="";
        document.getElementById("phone").value="";
        document.getElementById("email").value="";
        document.getElementById("password").value="";


        await loadEmployees();

    }
    catch(e){

        console.error(e);

        message(
        "Employee create नहीं हुआ: "+
        (e.message||e),
        false
        );

    }
    finally{

        btn.disabled=false;

        btn.innerText=
        "Add Employee";

    }

}


/* ==============================
   DETAILS
============================== */

async function details(id){

    const emp=
    employees.find(e=>e.id===id);

    if(!emp)
        return;


    const rows=
    await attendance(id);

    const status=
    currentStatus(rows);

    const minutes=
    workingTime(rows);


    alert(
`Employee Details

Name: ${emp.name||"-"}
Mobile: ${emp.phone||"-"}
Email: ${emp.email||"-"}

Status: ${status}

Today's Working:
${format(minutes)}`
    );

}


/* ==============================
   MESSAGE
============================== */

function message(text,ok){

    const box=
    document.getElementById("msg");

    box.innerText=text;

    box.className=
    ok
    ?"msg ok"
    :"msg err";

}


/* ==============================
   FORMAT
============================== */

function format(minutes){

    const h=
    Math.floor(minutes/60);

    const m=
    minutes%60;

    return h+"h "+m+"m";

}


/* ==============================
   SAFE TEXT
============================== */

function safe(value){

    return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==============================
   LOGOUT
============================== */

async function logout(){

    await db.auth.signOut();

    location.href=
    "owner-login.html";

}


/* ==============================
   AUTO REFRESH
============================== */

setInterval(
async function(){

    if(user)
        await loadEmployees();

},
30000
);

</script>

</body>
</html>
