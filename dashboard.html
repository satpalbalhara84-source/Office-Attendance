<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Dashboard - Office Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f6fa;
    color:#111827;
}

header{
    background:#2563eb;
    color:white;
    padding:18px 20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:5px 0 0;
    opacity:.9;
}

.logout{
    background:#dc2626;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.card h2{
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;
}

.primary{
    background:#2563eb;
    color:white;
}

.primary:hover{
    background:#1d4ed8;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.stat h3{
    margin:0;
    font-size:28px;
    color:#2563eb;
}

.stat p{
    margin:7px 0 0;
    color:#6b7280;
}

.employee-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.employee{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
}

.employee h3{
    margin:0 0 10px;
}

.employee p{
    margin:7px 0;
    color:#4b5563;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.badge.in{
    background:#dcfce7;
    color:#166534;
}

.badge.out{
    background:#fee2e2;
    color:#991b1b;
}

.badge.unknown{
    background:#fef3c7;
    color:#92400e;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.small-btn{
    margin-top:10px;
    padding:9px 13px;
    background:#2563eb;
    color:white;
}

.loading{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

.factory-info{
    background:#eff6ff;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .employee-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .header-inner{
        align-items:flex-start;
    }

    header h1{
        font-size:20px;
    }

}

</style>
</head>

<div class="container">

<!-- ADD EMPLOYEE -->

<div class="card">

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;
let employees = [];
let factories = [];


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    async function(){

        await checkLogin();

    }
);


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin(){

    const {
        data:{
            session
        }
    } =
    await db.auth.getSession();


    if(!session){

        window.location.href =
        "owner-login.html";

        return;

    }


    currentUser =
    session.user;


    document.getElementById(
        "ownerInfo"
    ).innerHTML = `

        <strong>Email:</strong>
        ${escapeHtml(currentUser.email)}

        <br><br>

        <strong>Owner ID:</strong>
        ${escapeHtml(currentUser.id)}

    `;


    await loadFactories();

    await loadEmployees();

}


/* =========================================
   LOAD FACTORIES
========================================= */

async function loadFactories(){

    const {
        data,
        error
    } =
    await db
    .from("factories")
    .select(
        "id,name,address,status"
    )
    .eq(
        "owner_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Factory error:",
            error
        );

        return;

    }


    factories =
    data || [];


    const select =
    document.getElementById(
        "factorySelect"
    );


    select.innerHTML =
    `<option value="">
        Factory चुनें
    </option>`;


    factories.forEach(
        function(factory){

            const option =
            document.createElement(
                "option"
            );

            option.value =
            factory.id;

            option.textContent =
            factory.name;

            select.appendChild(
                option
            );

        }
    );


    if(factories.length === 1){

        select.value =
        factories[0].id;

        showFactory(
            factories[0]
        );

    }


    if(factories.length > 1){

        select.addEventListener(
            "change",
            function(){

                const factory =
                factories.find(
                    f =>
                    f.id ===
                    select.value
                );

                if(factory){
                    showFactory(factory);
                }

            }
        );

    }

}


/* =========================================
   SHOW FACTORY
========================================= */

function showFactory(factory){

    const box =
    document.getElementById(
        "factoryInfo"
    );


    box.style.display =
    "block";


    box.innerHTML = `

        <strong>Factory:</strong>
        ${escapeHtml(factory.name)}

        <br>

        <strong>Status:</strong>
        ${escapeHtml(factory.status || "active")}

        ${
            factory.address
            ?
            `<br>
             <strong>Address:</strong>
             ${escapeHtml(factory.address)}`
            :
            ""
        }

    `;

}


/* =========================================
   LOAD EMPLOYEES
========================================= */

async function loadEmployees(){

    const {
        data,
        error
    } =
    await db
    .from("employees")
    .select("*")
    .eq(
        "owner_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Employee error:",
            error
        );

        document.getElementById(
            "employeeList"
        ).innerHTML = `

            <div class="loading">
                Employee load नहीं हुए
                <br><br>
                ${escapeHtml(error.message)}
            </div>

        `;

        return;

    }


    employees =
    data || [];


    document.getElementById(
        "totalEmployees"
    ).innerText =
    employees.length;


    await renderEmployees();

}


/* =========================================
   TODAY DATE
========================================= */

function getToday(){

    const now =
    new Date();

    const year =
    now.getFullYear();

    const month =
    String(
        now.getMonth()+1
    ).padStart(2,"0");

    const day =
    String(
        now.getDate()
    ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}


/* =========================================
   GET EMPLOYEE ATTENDANCE
========================================= */

async function getEmployeeAttendance(
    employeeId
){

    const today =
    getToday();


    const {
        data,
        error
    } =
    await db
    .from("attendance")
    .select("*")
    .eq(
        "employee_id",
        employeeId
    )
    .eq(
        "date",
        today
    )
    .order(
        "check_in",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Attendance error:",
            error
        );

        return [];

    }


    return data || [];

}


/* =========================================
   GET CURRENT STATUS
========================================= */

function getCurrentStatus(rows){

    if(
        !rows ||
        rows.length === 0
    ){

        return "OUT";

    }


    /*
      सबसे महत्वपूर्ण हिस्सा:

      Attendance table में status field
      मौजूद है तो उसी को प्राथमिकता देंगे।
    */

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        const row =
        rows[i];


        if(
            row.status &&
            (
                String(
                    row.status
                ).toUpperCase()
                === "IN"
                ||
                String(
                    row.status
                ).toUpperCase()
                === "OUT"
            )
        ){

            return String(
                row.status
            ).toUpperCase();

        }

    }


    /*
      अगर status खाली है तो
      check_in / check_out से पता लगाएँ।
    */

    const latest =
    rows[0];


    if(
        latest &&
        latest.check_in &&
        !latest.check_out
    ){

        return "IN";

    }


    return "OUT";

}


/* =========================================
   WORKING MINUTES
========================================= */

function getWorkingMinutes(rows){

    if(
        !rows ||
        rows.length === 0
    ){

        return 0;

    }


    let total = 0;


    rows.forEach(
        function(row){

            if(
                !row.check_in
            ){

                return;

            }


            const start =
            new Date(
                row.check_in
            );


            let end;


            if(row.check_out){

                end =
                new Date(
                    row.check_out
                );

            }
            else{

                /*
                  अगर अभी IN है,
                  तो current time तक count करें।
                */

                end =
                new Date();

            }


            if(
                !isNaN(start) &&
                !isNaN(end) &&
                end > start
            ){

                total +=
                Math.round(
                    (
                        end.getTime()
                        -
                        start.getTime()
                    )
                    /
                    60000
                );

            }

        }
    );


    return total;

}


/* =========================================
   RENDER EMPLOYEES
========================================= */

async function renderEmployees(){

    const container =
    document.getElementById(
        "employeeList"
    );


    if(
        employees.length === 0
    ){

        container.innerHTML = `

            <div class="loading">

                अभी कोई employee नहीं है।

            </div>

        `;


        document.getElementById(
            "totalIn"
        ).innerText =
        "0";


        document.getElementById(
            "totalOut"
        ).innerText =
        "0";


        document.getElementById(
            "totalWorking"
        ).innerText =
        "0h 0m";


        return;

    }


    let html = "";

    let inCount = 0;

    let outCount = 0;

    let totalWorking = 0;


    for(
        const employee of employees
    ){

        const rows =
        await getEmployeeAttendance(
            employee.id
        );


        /*
          Employee का actual status
        */

        const status =
        getCurrentStatus(
            rows
        );


        /*
          Today's total working
        */

        const minutes =
        getWorkingMinutes(
            rows
        );


        totalWorking +=
        minutes;


        if(
            status === "IN"
        ){

            inCount++;

        }
        else{

            outCount++;

        }


        let badgeClass =
        "out";


        if(
            status === "IN"
        ){

            badgeClass =
            "in";

        }


        html += `

        <div class="employee">

            <h3>
                👤
                ${escapeHtml(
                    employee.name ||
                    "Employee"
                )}
            </h3>


            <p>
                📱
                ${escapeHtml(
                    employee.phone ||
                    "-"
                )}
            </p>


            <p>
                ✉️
                ${escapeHtml(
                    employee.email ||
                    "-"
                )}
            </p>


            <p>

                Status:

                <span
                    class="badge ${badgeClass}"
                >

                    ${
                        status === "IN"
                        ? "IN"
                        : "OUT"
                    }

                </span>

            </p>


            <p>

                ⏱️ Today's Working:

                <strong>
                    ${formatMinutes(
                        minutes
                    )}
                </strong>

            </p>


            <p>

                🏭 Factory:

                <strong>
                    ${getFactoryName(
                        employee.factory_id
                    )}
                </strong>

            </p>


            <button
                class="small-btn"
                onclick="viewEmployee(
                    '${employee.id}'
                )"
            >

                View Details

            </button>

        </div>

        `;

    }


    container.innerHTML =
    html;


    document.getElementById(
        "totalIn"
    ).innerText =
    inCount;


    document.getElementById(
        "totalOut"
    ).innerText =
    outCount;


    document.getElementById(
        "totalWorking"
    ).innerText =
    formatMinutes(
        totalWorking
    );

}


/* =========================================
   FACTORY NAME
========================================= */

function getFactoryName(
    factoryId
){

    if(!factoryId){

        return "-";

    }


    const factory =
    factories.find(
        f =>
        f.id === factoryId
    );


    return factory
    ? factory.name
    : "-";

}


/* =========================================
   ADD EMPLOYEE
========================================= */

async function addEmployee(){

    const name =
    document.getElementById(
        "employeeName"
    ).value.trim();


    const phone =
    document.getElementById(
        "employeePhone"
    ).value.trim();


    const email =
    document.getElementById(
        "employeeEmail"
    ).value.trim();


    const password =
    document.getElementById(
        "employeePassword"
    ).value;


    const factoryId =
    document.getElementById(
        "factorySelect"
    ).value;


    const btn =
    document.getElementById(
        "addEmployeeBtn"
    );


    if(!name){

        showMessage(
            "Employee Name भरें।",
            false
        );

        return;

    }


    if(!phone){

        showMessage(
            "Mobile Number भरें।",
            false
        );

        return;

    }


    if(!email){

        showMessage(
            "Employee Email भरें।",
            false
        );

        return;

    }


    if(!password){

        showMessage(
            "Password भरें।",
            false
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password कम से कम 6 characters का होना चाहिए।",
            false
        );

        return;

    }


    if(!factoryId){

        showMessage(
            "Factory चुनें।",
            false
        );

        return;

    }


    btn.disabled =
    true;

    btn.innerText =
    "Employee बन रहा है...";


    try{

        /*
          Existing Edge Function
        */

        const {
            data,
            error
        } =
        await db.functions.invoke(
            "quick-endpoint",
            {
                body:{
                    name:name,
                    phone:phone,
                    email:email,
                    password:password
                }
            }
        );


        if(error){

            throw new Error(
                error.message ||
                "Employee create नहीं हुआ"
            );

        }


        console.log(
            "Employee created:",
            data
        );


        /*
          थोड़ी देर wait
        */

        await new Promise(
            resolve =>
            setTimeout(
                resolve,
                1200
            )
        );


        /*
          Employee record खोजें
        */

        const {
            data:created,
            error:findError
        }
        =
        await db
        .from("employees")
        .select(
            "id,email,owner_id,factory_id"
        )
        .eq(
            "email",
            email
        )
        .eq(
            "owner_id",
            currentUser.id
        )
        .limit(1);


        if(findError){

            console.error(
                findError
            );

        }


        if(
            created &&
            created.length > 0
        ){

            const employeeId =
            created[0].id;


            /*
              Factory assign
            */

            const {
                error:updateError
            }
            =
            await db
            .from("employees")
            .update({
                factory_id:
                factoryId
            })
            .eq(
                "id",
                employeeId
            )
            .eq(
                "owner_id",
                currentUser.id
            );


            if(updateError){

                console.error(
                    updateError
                );

                showMessage(
                    "Employee बन गया, लेकिन Factory mapping में समस्या हुई।",
                    false
                );

            }
            else{

                showMessage(
                    "Employee सफलतापूर्वक बन गया ✅",
                    true
                );

            }

        }
        else{

            showMessage(
                "Employee बन गया है। List refresh करके check करें।",
                true
            );

        }


        /*
          Form clear
        */

        document.getElementById(
            "employeeName"
        ).value = "";


        document.getElementById(
            "employeePhone"
        ).value = "";


        document.getElementById(
            "employeeEmail"
        ).value = "";


        document.getElementById(
            "employeePassword"
        ).value = "";


        await loadEmployees();


    }
    catch(error){

        console.error(
            error
        );


        showMessage(
            "Employee create नहीं हुआ: " +
            error.message,
            false
        );

    }
    finally{

        btn.disabled =
        false;

        btn.innerText =
        "Add Employee";

    }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    success
){

    const box =
    document.getElementById(
        "addMessage"
    );


    box.innerText =
    text;


    box.className =
    success
    ? "message success"
    : "message error";

}


/* =========================================
   EMPLOYEE DETAILS
========================================= */

async function viewEmployee(
    employeeId
){

    const employee =
    employees.find(
        e =>
        e.id === employeeId
    );


    if(!employee){

        return;

    }


    const rows =
    await getEmployeeAttendance(
        employeeId
    );


    const status =
    getCurrentStatus(
        rows
    );


    const minutes =
    getWorkingMinutes(
        rows
    );


    let details = "";

    details +=
    "Employee Details\n\n";


    details +=
    "Name: " +
    (employee.name || "-") +
    "\n";


    details +=
    "Mobile: " +
    (employee.phone || "-") +
    "\n";


    details +=
    "Email: " +
    (employee.email || "-") +
    "\n";


    details +=
    "Status: " +
    status +
    "\n";


    details +=
    "Today's Working: " +
    formatMinutes(minutes) +
    "\n";


    details +=
    "Factory: " +
    getFactoryName(
        employee.factory_id
    );


    alert(
        details
    );

}


/* =========================================
   FORMAT MINUTES
========================================= */

function formatMinutes(
    minutes
){

    minutes =
    Math.max(
        0,
        Math.round(
            minutes || 0
        )
    );


    const hours =
    Math.floor(
        minutes / 60
    );


    const mins =
    minutes % 60;


    return (
        hours +
        "h " +
        mins +
        "m"
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
