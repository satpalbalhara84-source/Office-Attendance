<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Attendance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
    color: #111827;
}

.header {
    background: #2563eb;
    color: white;
    padding: 20px;
}

.header h2 {
    margin: 0;
}

.header p {
    margin: 6px 0 0;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.stat-title {
    color: #6b7280;
    font-size: 14px;
}

.stat-value {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}

.green {
    color: #16a34a;
}

.red {
    color: #dc2626;
}

.blue {
    color: #2563eb;
}

.orange {
    color: #ea580c;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f8fafc;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.badge-in {
    background: #dcfce7;
    color: #166534;
}

.badge-out {
    background: #fee2e2;
    color: #991b1b;
}

.badge-away {
    background: #ffedd5;
    color: #9a3412;
}

.date-box {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.date-box input {
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 15px;
}

.logout {
    background: #dc2626;
}

.refresh {
    background: #16a34a;
}

.employee-card {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.employee-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.employee-name {
    font-size: 20px;
    font-weight: bold;
}

.total-time {
    font-size: 20px;
    font-weight: bold;
    color: #2563eb;
}

.session-table {
    margin-top: 15px;
    font-size: 14px;
}

.message {
    padding: 12px;
    background: #f8fafc;
    border-radius: 8px;
    margin-bottom: 15px;
}

@media (max-width: 800px) {

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

@media (max-width: 500px) {

    .container {
        padding: 12px;
    }

    .stats {
        grid-template-columns:
            1fr 1fr;
        gap: 10px;
    }

    .stat {
        padding: 15px;
    }

    .stat-value {
        font-size: 24px;
    }

    .card {
        padding: 15px;
    }

}

</style>

</head>


<body>


<div class="header">

    <h2>Office Attendance</h2>

    <p>Owner Dashboard</p>

</div>


<div class="container">


<!-- OWNER INFO -->

<div class="card">

    <h2 id="ownerName">
        Loading...
    </h2>

    <p id="ownerEmail">
        —
    </p>

</div>



<!-- STATS -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">
            Total Employees
        </div>

        <div
            id="totalEmployees"
            class="stat-value blue"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Currently IN
        </div>

        <div
            id="totalIn"
            class="stat-value green"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            OUT
        </div>

        <div
            id="totalOut"
            class="stat-value red"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Total Working Time
        </div>

        <div
            id="totalWorking"
            class="stat-value orange"
        >
            0h 0m
        </div>

    </div>


</div>



<!-- DATE -->

<div class="card">

    <div class="date-box">

        <strong>
            Attendance Date:
        </strong>

        <input
            type="date"
            id="attendanceDate"
        >

        <button
            onclick="loadDashboard()"
        >
            Search
        </button>

        <button
            class="refresh"
            onclick="loadDashboard()"
        >
            🔄 Refresh
        </button>

    </div>

</div>



<!-- MESSAGE -->

<div
    id="message"
    class="message"
>
    Attendance loading...
</div>



<!-- EMPLOYEE ATTENDANCE -->

<div class="card">

    <h2>
        👥 Employee Attendance
    </h2>

    <div id="employeeList">

        Loading...

    </div>

</div>



<!-- LOGOUT -->

<button
    class="logout"
    onclick="logout()"
>
    Logout
</button>


</div>



<script>


/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================
   GLOBAL VARIABLES
===================================== */

let currentUser = null;

let currentOwnerId = null;

let employees = [];

let attendanceData = [];

let office = null;



/* =====================================
   GET CURRENT USER
===================================== */

async function getCurrentUser() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    if (
        error ||
        !data.session
    ) {

        window.location.href =
            "employee-login.html";

        return null;

    }


    currentUser =
        data.session.user;


    document.getElementById(
        "ownerEmail"
    ).innerText =
        currentUser.email;


    return currentUser;

}



/* =====================================
   LOAD OWNER
===================================== */

async function loadOwner() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select("owner_id")
        .eq(
            "email",
            currentUser.email
        )
        .limit(1);


    if (
        error ||
        !data ||
        data.length === 0
    ) {

        /*
           अगर owner table अलग है
           तो बाद में यहां बदलेंगे
        */

        document.getElementById(
            "message"
        ).innerText =
            "Owner information नहीं मिली।";


        return false;

    }


    currentOwnerId =
        data[0].owner_id;


    document.getElementById(
        "ownerName"
    ).innerText =
        "Owner Dashboard";


    return true;

}



/* =====================================
   LOAD EMPLOYEES
===================================== */

async function loadEmployees() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select("*")
        .eq(
            "owner_id",
            currentOwnerId
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.log(
            "EMPLOYEE ERROR:",
            error
        );


        document.getElementById(
            "message"
        ).innerText =
            "Employees load error: " +
            error.message;


        return false;

    }


    employees =
        data || [];


    document.getElementById(
        "totalEmployees"
    ).innerText =
        employees.length;


    return true;

}



/* =====================================
   LOAD OFFICE
===================================== */

async function loadOffice() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("offices")
        .select("*")
        .eq(
            "owner_id",
            currentOwnerId
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        )
        .limit(1);


    if (
        error
    ) {

        console.log(
            "OFFICE ERROR:",
            error
        );

        return;

    }


    if (
        data &&
        data.length > 0
    ) {

        office =
            data[0];

    }

}



/* =====================================
   DATE RANGE
===================================== */

function getDateRange(
    dateString
) {

    const parts =
        dateString.split("-");


    const year =
        Number(parts[0]);


    const month =
        Number(parts[1]) - 1;


    const day =
        Number(parts[2]);


    const start =
        new Date(
            year,
            month,
            day,
            0,
            0,
            0,
            0
        );


    const end =
        new Date(
            year,
            month,
            day + 1,
            0,
            0,
            0,
            0
        );


    return {

        start:
            start.toISOString(),

        end:
            end.toISOString()

    };

}



/* =====================================
   LOAD ATTENDANCE
===================================== */

async function loadAttendance() {

    const date =
        document.getElementById(
            "attendanceDate"
        ).value;


    const range =
        getDateRange(
            date
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("attendance")
        .select("*")
        .in(
            "employee_id",
            employees.map(
                employee =>
                    employee.id
            )
        )
        .gte(
            "created_at",
            range.start
        )
        .lt(
            "created_at",
            range.end
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.log(
            "ATTENDANCE ERROR:",
            error
        );


        document.getElementById(
            "message"
        ).innerText =
            "Attendance load error: " +
            error.message;


        return false;

    }


    attendanceData =
        data || [];


    return true;

}



/* =====================================
   FORMAT TIME
===================================== */

function formatTime(
    value
) {

    if (!value) {

        return "—";

    }


    return new Date(value)
        .toLocaleTimeString(
            "en-IN",
            {

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"

            }
        );

}



/* =====================================
   FORMAT MINUTES
===================================== */

function formatMinutes(
    minutes
) {

    minutes =
        Number(minutes) || 0;


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        hours +
        "h " +
        mins +
        "m"
    );

}



/* =====================================
   EMPLOYEE STATUS
===================================== */

function getEmployeeStatus(
    employeeAttendance
) {

    /*
       Latest open session
    */

    const openSession =
        [...employeeAttendance]
            .reverse()
            .find(
                row =>
                    !row.out_time
            );


    if (openSession) {

        /*
           अगर outside_since है
           तो employee grace/outside में है
        */

        if (
            openSession.outside_since
        ) {

            return {

                type:
                    "away",

                text:
                    "🟠 बाहर / Grace"

            };

        }


        return {

            type:
                "in",

            text:
                "🟢 IN"

        };

    }


    return {

        type:
            "out",

        text:
            "🔴 OUT"

    };

}



/* =====================================
   EMPLOYEE TOTAL
===================================== */

function getEmployeeTotal(
    employeeAttendance
) {

    let total =
        0;


    employeeAttendance.forEach(
        row => {

            if (
                row.out_time &&
                row.working_minutes !== null &&
                row.working_minutes !== undefined
            ) {

                total +=
                    Number(
                        row.working_minutes
                    );

            }

        }
    );


    /*
       अगर current open session है
       तो live time जोड़ें
    */

    const openSession =
        [...employeeAttendance]
            .reverse()
            .find(
                row =>
                    !row.out_time
            );


    if (
        openSession &&
        openSession.in_time
    ) {

        const liveMinutes =
            Math.floor(

                (
                    Date.now() -
                    new Date(
                        openSession.in_time
                    ).getTime()

                ) / 60000

            );


        total +=
            Math.max(
                0,
                liveMinutes
            );

    }


    return total;

}



/* =====================================
   RENDER DASHBOARD
===================================== */

function renderDashboard() {

    const list =
        document.getElementById(
            "employeeList"
        );


    if (
        employees.length === 0
    ) {

        list.innerHTML =
            "<p>कोई employee नहीं मिला।</p>";


        document.getElementById(
            "totalIn"
        ).innerText =
            "0";


        document.getElementById(
            "totalOut"
        ).innerText =
            "0";


        document.getElementById(
            "totalWorking"
        ).innerText =
            "0h 0m";


        return;

    }


    let totalIn =
        0;

    let totalOut =
        0;

    let companyTotal =
        0;


    let html =
        "";


    employees.forEach(
        employee => {

            const rows =
                attendanceData.filter(
                    row =>
                        row.employee_id ===
                        employee.id
                );


            const status =
                getEmployeeStatus(
                    rows
                );


            const employeeTotal =
                getEmployeeTotal(
                    rows
                );


            companyTotal +=
                employeeTotal;


            if (
                status.type ===
                "in"
            ) {

                totalIn++;

            }

            else {

                totalOut++;

            }


            html += `

            <div class="employee-card">

                <div class="employee-header">

                    <div>

                        <div class="employee-name">

                            ${escapeHtml(
                                employee.name ||
                                "Employee"
                            )}

                        </div>

                        <div>

                            ${escapeHtml(
                                employee.email ||
                                ""
                            )}

                        </div>

                    </div>


                    <div>

                        <span
                            class="badge badge-${status.type}"
                        >

                            ${status.text}

                        </span>

                    </div>

                </div>


                <hr>


                <div class="total-time">

                    Today's Total:
                    ${formatMinutes(
                        employeeTotal
                    )}

                </div>


                <div class="session-table">

                    ${renderEmployeeSessions(
                        rows
                    )}

                </div>

            </div>

            `;

        }
    );


    list.innerHTML =
        html;


    document.getElementById(
        "totalIn"
    ).innerText =
        totalIn;


    document.getElementById(
        "totalOut"
    ).innerText =
        totalOut;


    document.getElementById(
        "totalWorking"
    ).innerText =
        formatMinutes(
            companyTotal
        );


    document.getElementById(
        "message"
    ).innerText =
        "Attendance successfully loaded.";

}



/* =====================================
   RENDER EMPLOYEE SESSIONS
===================================== */

function renderEmployeeSessions(
    rows
) {

    if (
        rows.length === 0
    ) {

        return `
            <p>
                आज कोई attendance नहीं।
            </p>
        `;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        Session
                    </th>

                    <th>
                        IN
                    </th>

                    <th>
                        OUT
                    </th>

                    <th>
                        Working
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    rows.forEach(
        (row, index) => {

            let working =
                "Running...";


            if (
                row.out_time
            ) {

                working =
                    formatMinutes(
                        row.working_minutes
                    );

            }

            else if (
                row.in_time
            ) {

                const liveMinutes =
                    Math.floor(

                        (
                            Date.now() -
                            new Date(
                                row.in_time
                            ).getTime()

                        ) / 60000

                    );


                working =
                    formatMinutes(
                        liveMinutes
                    );

            }


            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${formatTime(
                            row.in_time
                        )}
                    </td>

                    <td>
                        ${
                            row.out_time
                            ?
                            formatTime(
                                row.out_time
                            )
                            :
                            "Working"
                        }
                    </td>

                    <td>
                        ${working}
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    return html;

}



/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================
   LOAD DASHBOARD
===================================== */

async function loadDashboard() {

    document.getElementById(
        "message"
    ).innerText =
        "Attendance loading...";


    const attendanceLoaded =
        await loadAttendance();


    if (
        !attendanceLoaded
    ) {

        return;

    }


    renderDashboard();

}



/* =====================================
   START
===================================== */

async function startApp() {

    const user =
        await getCurrentUser();


    if (!user) {

        return;

    }


    const ownerLoaded =
        await loadOwner();


    if (!ownerLoaded) {

        return;

    }


    await loadEmployees();

    await loadOffice();


    /*
       Today's date
    */

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "attendanceDate"
    ).value =
        year +
        "-" +
        month +
        "-" +
        day;


    await loadDashboard();


    /*
       हर 30 second refresh
    */

    setInterval(
        loadDashboard,
        30000
    );

}


startApp();



/* =====================================
   LOGOUT
===================================== */

async function logout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "employee-login.html";

}


</script>


</body>

</html>
