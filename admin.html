<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Super Admin - Office Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f6fa;
    color:#111827;
}

/* HEADER */

.header{
    background:#111827;
    color:white;
    padding:20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
}

.header h2{
    margin:0;
}

.header p{
    margin:6px 0 0;
    color:#d1d5db;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* CARD */

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stat-title{
    color:#6b7280;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.blue{
    color:#2563eb;
}

.green{
    color:#16a34a;
}

.red{
    color:#dc2626;
}

.orange{
    color:#ea580c;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group select{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

.form-group input:focus,
.form-group select:focus{
    outline:none;
    border-color:#2563eb;
}

/* BUTTON */

button{
    padding:11px 18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    color:white;
    background:#2563eb;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

.add-btn{
    background:#16a34a;
}

.refresh{
    background:#2563eb;
}

.logout{
    background:#dc2626;
}

.small-btn{
    padding:8px 12px;
    font-size:13px;
}

/* MESSAGE */

.message{
    padding:12px;
    background:#eff6ff;
    border-radius:8px;
    margin-bottom:20px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

/* TABLE */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f8fafc;
}

/* BADGES */

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-active{
    background:#dcfce7;
    color:#166534;
}

.badge-inactive{
    background:#fee2e2;
    color:#991b1b;
}

/* HIDDEN */

.hidden{
    display:none;
}

/* LOADING */

.loading{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

/* MOBILE */

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .container{
        padding:12px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat-value{
        font-size:22px;
    }

    th,
    td{
        font-size:13px;
        padding:8px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="header-inner">

        <h2>🏢 Office Attendance</h2>

        <p>Super Admin Panel</p>

    </div>

</div>



<div class="container">


<!-- ADMIN -->

<div class="card">

    <h2>
        👑 Super Admin
    </h2>

    <div id="adminEmail">
        Checking login...
    </div>

</div>



<!-- STATS -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">
            Total Factories
        </div>

        <div
            id="totalFactories"
            class="stat-value blue"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Total Employees
        </div>

        <div
            id="totalEmployees"
            class="stat-value green"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Active Factories
        </div>

        <div
            id="activeFactories"
            class="stat-value green"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Inactive Factories
        </div>

        <div
            id="inactiveFactories"
            class="stat-value red"
        >
            0
        </div>

    </div>


</div>



<!-- MESSAGE -->

<div
    id="message"
    class="message"
>
    Loading...
</div>



<!-- ADD FACTORY -->

<div class="card">

    <h2>
        ➕ Add New Factory
    </h2>

    <p style="color:#6b7280;">
        नई factory का basic record यहाँ बनाएँ।
    </p>


    <div class="form-grid">


        <div class="form-group">

            <label>
                Factory Name *
            </label>

            <input
                type="text"
                id="factoryName"
                placeholder="Example: ABC Factory"
            >

        </div>


        <div class="form-group">

            <label>
                Owner ID *
            </label>

            <input
                type="text"
                id="ownerId"
                placeholder="Owner UUID"
            >

        </div>


        <div class="form-group">

            <label>
                Address
            </label>

            <input
                type="text"
                id="factoryAddress"
                placeholder="Factory Address"
            >

        </div>


        <div class="form-group">

            <label>
                Status
            </label>

            <select id="factoryStatus">

                <option value="active">
                    Active
                </option>

                <option value="inactive">
                    Inactive
                </option>

            </select>

        </div>


    </div>


    <br>


    <button
        class="add-btn"
        onclick="addFactory()"
    >
        ➕ Add Factory
    </button>


</div>



<!-- FACTORY LIST -->

<div class="card">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        flex-wrap:wrap;
    ">

        <h2>
            🏭 Factory Management
        </h2>

        <button
            class="refresh"
            onclick="loadFactories()"
        >
            🔄 Refresh
        </button>

    </div>


    <br>


    <div
        id="factoryList"
        class="loading"
    >
        Loading factories...
    </div>

</div>



<!-- LOGOUT -->

<button
    class="logout"
    onclick="logout()"
>
    Logout
</button>


</div>



<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================
   GLOBAL
===================================== */

let currentUser = null;

let factories = [];



/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type="normal"
){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.className = "message";

    if(type === "success"){
        box.classList.add("success");
    }

    if(type === "error"){
        box.classList.add("error");
    }

}



/* =====================================
   CHECK ADMIN
===================================== */

async function checkAdmin(){

    const {
        data,
        error
    } =
    await db.auth.getSession();


    if(
        error ||
        !data.session
    ){

        window.location.href =
            "employee-login.html";

        return false;

    }


    currentUser =
        data.session.user;


    document.getElementById(
        "adminEmail"
    ).innerText =
        currentUser.email;


    /* Check admin_users */

    const {
        data:admin,
        error:adminError
    } =
    await db
        .from("admin_users")
        .select("user_id")
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if(
        adminError
    ){

        console.error(adminError);

        showMessage(
            "Admin check error: " +
            adminError.message,
            "error"
        );

        return false;

    }


    if(!admin){

        document.body.innerHTML = `

            <div style="
                max-width:600px;
                margin:80px auto;
                padding:20px;
                font-family:Arial;
                text-align:center;
            ">

                <h2>🔒 Access Denied</h2>

                <p>
                    यह account Super Admin नहीं है।
                </p>

                <button
                    onclick="logout()"
                    style="
                        padding:12px 20px;
                        background:#dc2626;
                        color:white;
                        border:0;
                        border-radius:8px;
                        cursor:pointer;
                    "
                >
                    Logout
                </button>

            </div>

        `;

        return false;

    }


    return true;

}



/* =====================================
   LOAD FACTORIES
===================================== */

async function loadFactories(){

    showMessage(
        "Factories loading..."
    );


    const {
        data,
        error
    } =
    await db
        .from("factories")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        showMessage(
            "Factories load error: " +
            error.message,
            "error"
        );

        return;

    }


    factories =
        data || [];


    await renderFactories();


    showMessage(
        "Factories successfully loaded ✅",
        "success"
    );

}



/* =====================================
   RENDER FACTORIES
===================================== */

async function renderFactories(){

    const box =
        document.getElementById(
            "factoryList"
        );


    if(
        factories.length === 0
    ){

        box.innerHTML = `

            <div class="loading">
                अभी कोई factory नहीं है।
            </div>

        `;

        updateStats(0,0,0);

        return;

    }


    let totalEmployees = 0;

    let active = 0;

    let inactive = 0;


    let html = `

        <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Factory
                    </th>

                    <th>
                        Owner ID
                    </th>

                    <th>
                        Employees
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Created
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    for(
        const factory
        of factories
    ){

        const {
            count,
            error
        } =
        await db
            .from("employees")
            .select(
                "id",
                {
                    count:"exact",
                    head:true
                }
            )
            .eq(
                "factory_id",
                factory.id
            );


        if(error){

            console.error(error);

        }


        const employeeCount =
            count || 0;


        totalEmployees +=
            employeeCount;


        if(
            factory.status ===
            "active"
        ){

            active++;

        }
        else{

            inactive++;

        }


        html += `

            <tr>

                <td>

                    <strong>
                        ${escapeHtml(
                            factory.name
                        )}
                    </strong>

                    ${
                        factory.address
                        ?
                        `<div style="
                            color:#6b7280;
                            font-size:12px;
                            margin-top:4px;
                        ">
                            ${escapeHtml(
                                factory.address
                            )}
                        </div>`
                        :
                        ""
                    }

                </td>


                <td style="
                    font-size:12px;
                    word-break:break-all;
                ">

                    ${escapeHtml(
                        factory.owner_id
                    )}

                </td>


                <td>

                    <strong>
                        ${employeeCount}
                    </strong>

                </td>


                <td>

                    <span class="
                        badge
                        badge-${escapeHtml(
                            factory.status
                        )}
                    ">

                        ${
                            factory.status ===
                            "active"
                            ?
                            "🟢 Active"
                            :
                            "🔴 Inactive"
                        }

                    </span>

                </td>


                <td>

                    ${
                        factory.created_at
                        ?
                        new Date(
                            factory.created_at
                        ).toLocaleDateString(
                            "en-IN"
                        )
                        :
                        "—"
                    }

                </td>

            </tr>

        `;

    }


    html += `

            </tbody>

        </table>

        </div>

    `;


    box.innerHTML =
        html;


    updateStats(
        factories.length,
        totalEmployees,
        active,
        inactive
    );

}



/* =====================================
   UPDATE STATS
===================================== */

function updateStats(
    factoryCount,
    employeeCount,
    activeCount,
    inactiveCount
){

    document.getElementById(
        "totalFactories"
    ).innerText =
        factoryCount;


    document.getElementById(
        "totalEmployees"
    ).innerText =
        employeeCount;


    document.getElementById(
        "activeFactories"
    ).innerText =
        activeCount;


    document.getElementById(
        "inactiveFactories"
    ).innerText =
        inactiveCount;

}



/* =====================================
   ADD FACTORY
===================================== */

async function addFactory(){

    const name =
        document.getElementById(
            "factoryName"
        ).value.trim();


    const ownerId =
        document.getElementById(
            "ownerId"
        ).value.trim();


    const address =
        document.getElementById(
            "factoryAddress"
        ).value.trim();


    const status =
        document.getElementById(
            "factoryStatus"
        ).value;


    if(!name){

        alert(
            "Factory Name डालें।"
        );

        return;

    }


    if(!ownerId){

        alert(
            "Owner ID डालें।"
        );

        return;

    }


    showMessage(
        "Factory create हो रही है..."
    );


    const {
        data,
        error
    } =
    await db
        .from("factories")
        .insert([
            {
                name:name,
                owner_id:ownerId,
                address:address || null,
                status:status
            }
        ])
        .select()
        .single();


    if(error){

        console.error(error);

        showMessage(
            "Factory create error: " +
            error.message,
            "error"
        );

        return;

    }


    console.log(
        "Created factory:",
        data
    );


    document.getElementById(
        "factoryName"
    ).value = "";


    document.getElementById(
        "ownerId"
    ).value = "";


    document.getElementById(
        "factoryAddress"
    ).value = "";


    document.getElementById(
        "factoryStatus"
    ).value =
        "active";


    showMessage(
        "Factory successfully created ✅",
        "success"
    );


    await loadFactories();

}



/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await db.auth.signOut();

    window.location.href =
        "employee-login.html";

}



/* =====================================
   START
===================================== */

async function startApp(){

    const isAdmin =
        await checkAdmin();


    if(!isAdmin){

        return;

    }


    await loadFactories();

}


startApp();


</script>

</body>

</html>
