/* =====================================
   VARIABLES

let currentEmployee = null;

let watchId = null;

let outsideTimer = null;

const GRACE_TIME =
2 * 60 * 1000;


/* =====================================
   USER
===================================== */

async function getCurrentUser(){

    const {data,error} =
        await supabaseClient.auth.getSession();

    if(error || !data.session){

        window.location.href =
            "employee-login.html";

        return null;
    }

    return data.session.user;
}


/* =====================================
   EMPLOYEE
===================================== */

async function loadEmployee(user){

    const {data,error} =
        await supabaseClient
        .from("employees")
        .select("*")
        .eq("email",user.email)
        .limit(1);

    if(
        error ||
        !data ||
        data.length===0
    ){

        document.getElementById(
            "employeeName"
        ).innerText =
            "Employee profile नहीं मिला";

        document.getElementById(
            "message"
        ).innerText =
            error?.message ||
            "Employee record नहीं मिला";

        return false;
    }

    currentEmployee =
        data[0];

    document.getElementById(
        "employeeName"
    ).innerText =
        "Welcome, " +
        currentEmployee.name;

    return true;
}


/* =====================================
   OFFICE
===================================== */

async function loadOffice(){

    const ownerId =
        currentEmployee.owner_id;

    const {data,error} =
        await supabaseClient
        .from("offices")
        .select("*")
        .eq("owner_id",ownerId)
        .order(
            "created_at",
            {ascending:false}
        )
        .limit(1);

    if(
        error ||
        !data ||
        data.length===0
    ){

        document.getElementById(
            "message"
        ).innerText =
            "Office location नहीं मिली";

        return false;
    }

    office =
        data[0];

    document.getElementById(
        "radius"
    ).innerText =
        office.radius_meters +
        " meters";

    return true;
}


/* =====================================
   TODAY RANGE
===================================== */

function getTodayRange(){

    const now =
        new Date();

    const start =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
            0,0,0,0
        );

    const end =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()+1,
            0,0,0,0
        );

    return {

        start:
            start.toISOString(),

        end:
            end.toISOString()

    };
}


/* =====================================
   LOAD ATTENDANCE
===================================== */

async function loadAttendance(){

    const range =
        getTodayRange();

    const {data,error} =
        await supabaseClient
        .from("attendance")
        .select("*")
        .eq(
            "employee_id",
            currentEmployee.id
        )
        .gte(
            "created_at",
            range.start
        )
        .lt(
            "created_at",
            range.end
        )
        .order(
            "created_at",
            {ascending:false}
        )
        .limit(1);

    if(error){

        console.log(
            "ATTENDANCE ERROR:",
            error
        );

        return;
    }

    if(data && data.length>0){

        currentAttendance =
            data[0];

        updateAttendanceDisplay();

        /*
         IMPORTANT:
         Refresh ke baad agar employee
         already office se bahar tha
         to saved outside_since se timer
         dobara wahi se chalega.
        */

        if(
            currentAttendance.outside_since &&
            !currentAttendance.out_time
        ){

            startOutsideTimer(
                new Date(
                    currentAttendance
                    .outside_since
                ).getTime()
            );
        }
    }
}


/* =====================================
   MARK IN
===================================== */

async function markIN(
    latitude,
    longitude
){

    /*
      Sirf OPEN attendance hone par
      duplicate IN roko.
    */

    if(
        currentAttendance &&
        !currentAttendance.out_time
    ){
        return;
    }

    const {data,error} =
        await supabaseClient
        .from("attendance")
        .insert({

            employee_id:
                currentEmployee.id,

            office_id:
                office.id,

            in_time:
                new Date().toISOString(),

            status:
                "present",

            last_latitude:
                latitude,

            last_longitude:
                longitude,

            outside_since:
                null

        })
        .select()
        .limit(1);

    if(error){

        console.log(
            "IN ERROR:",
            error
        );

        document.getElementById(
            "message"
        ).innerText =
            "IN attendance error: " +
            error.message;

        return;
    }

    if(data && data.length>0){

        currentAttendance =
            data[0];

        updateAttendanceDisplay();
    }

    document.getElementById(
        "message"
    ).innerText =
        "Office में प्रवेश दर्ज हो गया ✅";
}


/* =====================================
   SAVE OUTSIDE START
===================================== */

async function saveOutsideSince(
    latitude,
    longitude
){

    if(
        !currentAttendance ||
        currentAttendance.out_time
    ){
        return;
    }

    /*
      Agar already saved hai to
      dobara timer start mat karo.
    */

    if(currentAttendance.outside_since){

        return;
    }

    const outsideTime =
        new Date();

    const {data,error} =
        await supabaseClient
        .from("attendance")
        .update({

            outside_since:
                outsideTime.toISOString(),

            last_latitude:
                latitude,

            last_longitude:
                longitude

        })
        .eq(
            "id",
            currentAttendance.id
        )
        .select()
        .limit(1);

    if(error){

        console.log(
            "OUTSIDE TIME ERROR:",
            error
        );

        return;
    }

    if(data && data.length>0){

        currentAttendance =
            data[0];
    }

    startOutsideTimer(
        outsideTime.getTime()
    );
}


/* =====================================
   CANCEL OUTSIDE TIMER
===================================== */

async function cancelOutsideTimer(){

    if(outsideTimer){

        clearInterval(
            outsideTimer
        );

        outsideTimer = null;
    }

    document.getElementById(
        "graceBox"
    ).style.display =
        "none";


    if(
        !currentAttendance ||
        currentAttendance.out_time
    ){

        return;
    }

    /*
      Database se outside_since clear
      kar do.
    */

    const {data,error} =
        await supabaseClient
        .from("attendance")
        .update({

            outside_since:
                null

        })
        .eq(
            "id",
            currentAttendance.id
        )
        .select()
        .limit(1);

    if(!error && data && data.length>0){

        currentAttendance =
            data[0];
    }
}


/* =====================================
   OUTSIDE TIMER
===================================== */

function startOutsideTimer(
    startTime
){

    /*
      Existing timer clear
    */

    if(outsideTimer){

        clearInterval(
            outsideTimer
        );
    }


    document.getElementById(
        "graceBox"
    ).style.display =
        "block";


    function updateTimer(){

        if(
            !currentAttendance ||
            currentAttendance.out_time
        ){

            clearInterval(
                outsideTimer
            );

            outsideTimer = null;

            document.getElementById(
                "graceBox"
            ).style.display =
                "none";

            return;
        }


        const elapsed =
            Date.now() -
            startTime;

        const remaining =
            GRACE_TIME -
            elapsed;


        if(remaining <= 0){

            clearInterval(
                outsideTimer
            );

            outsideTimer = null;

            document.getElementById(
                "graceTimer"
            ).innerText =
                "00:00";

            markOUT(
                lastLatitude,
                lastLongitude
            );

            return;
        }


        const totalSeconds =
            Math.ceil(
                remaining / 1000
            );

        const minutes =
            Math.floor(
                totalSeconds / 60
            );

        const seconds =
            totalSeconds % 60;


        document.getElementById(
            "graceTimer"
        ).innerText =

            String(minutes)
            .padStart(2,"0")

            + ":" +

            String(seconds)
            .padStart(2,"0");
    }


    updateTimer();

    outsideTimer =
        setInterval(
            updateTimer,
            1000
        );
}


/* =====================================
   LAST GPS
===================================== */

let lastLatitude = null;

let lastLongitude = null;


/* =====================================
   MARK OUT
===================================== */

async function markOUT(
    latitude,
    longitude
){

    if(
        !currentAttendance ||
        currentAttendance.out_time
    ){

        return;
    }


    const outTime =
        new Date();

    const inTime =
        new Date(
            currentAttendance.in_time
        );


    const minutes =
        Math.max(
            0,
            Math.round(
                (
                    outTime -
                    inTime
                ) / 60000
            )
        );


    const {data,error} =
        await supabaseClient
        .from("attendance")
        .update({

            out_time:
                outTime.toISOString(),

            working_minutes:
                minutes,

            status:
                "completed",

            outside_since:
                null,

            last_latitude:
                latitude,

            last_longitude:
                longitude

        })
        .eq(
            "id",
            currentAttendance.id
        )
        .select()
        .limit(1);


    if(error){

        console.log(
            "OUT ERROR:",
            error
        );

        document.getElementById(
            "message"
        ).innerText =
            "OUT attendance error: " +
            error.message;

        return;
    }


    if(
        data &&
        data.length>0
    ){

        currentAttendance =
            data[0];

        updateAttendanceDisplay();
    }


    document.getElementById(
        "graceBox"
    ).style.display =
        "none";


    document.getElementById(
        "message"
    ).innerText =
        "5 मिनट बाहर रहने के बाद OUT दर्ज हो गया ✅";


    document.getElementById(
        "status"
    ).innerText =
        "🔴 OUT - Office से बाहर";


    document.getElementById(
        "status"
    ).className =
        "status outside";
}


/* =====================================
   DISTANCE
===================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;

    const dLat =
        (
            lat2 -
            lat1
        ) *
        Math.PI / 180;

    const dLon =
        (
            lon2 -
            lon1
        ) *
        Math.PI / 180;


    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1 *
            Math.PI/180
        )

        *

        Math.cos(
            lat2 *
            Math.PI/180
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;
}


/* =====================================
   HANDLE LOCATION
===================================== */

async function handleLocation(
    position
){

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    lastLatitude =
        latitude;

    lastLongitude =
        longitude;


    document.getElementById(
        "latitude"
    ).innerText =
        latitude.toFixed(6);


    document.getElementById(
        "longitude"
    ).innerText =
        longitude.toFixed(6);


    document.getElementById(
        "accuracy"
    ).innerText =
        Math.round(accuracy) +
        " meters";


    const distance =
        calculateDistance(

            latitude,
            longitude,

            office.latitude,
            office.longitude
        );


    document.getElementById(
        "distance"
    ).innerText =
        Math.round(distance) +
        " meters";


    const radius =
        Number(
            office.radius_meters
        );


    const inside =
        distance <= radius;


    /* =================================
       INSIDE
    ================================= */

    if(inside){

        isInside = true;


        document.getElementById(
            "status"
        ).innerText =
            "🟢 IN - Office में";


        document.getElementById(
            "status"
        ).className =
            "status inside";


        /*
          Agar employee grace period
          ke andar wapas aa gaya.
        */

        if(
            currentAttendance &&
            !currentAttendance.out_time &&
            currentAttendance.outside_since
        ){

            await cancelOutsideTimer();

            document.getElementById(
                "message"
            ).innerText =
                "आप वापस Office में आ गए ✅";

        }


        /*
          New IN only if no open attendance
        */

        if(
            !currentAttendance ||
            currentAttendance.out_time
        ){

            await markIN(
                latitude,
                longitude
            );
        }


        return;
    }


    /* =================================
       OUTSIDE
    ================================= */

    isInside = false;


    /*
      Agar attendance hi nahi hai,
      to OUT mat karo.
    */

    if(
        !currentAttendance
    ){

        document.getElementById(
            "status"
        ).innerText =
            "🟠 Office से बाहर";


        document.getElementById(
            "status"
        ).className =
            "status waiting";


        document.getElementById(
            "message"
        ).innerText =
            "Office radius से बाहर हैं। IN attendance नहीं है।";

        return;
    }


    /*
      Agar already OUT ho chuka hai
    */

    if(
        currentAttendance.out_time
    ){

        document.getElementById(
            "status"
        ).innerText =
            "🔴 OUT - Office से बाहर";


        document.getElementById(
            "status"
        ).className =
            "status outside";


        return;
    }


    /*
      IMPORTANT:
      Pehli baar bahar jaate hi
      database mein outside_since save hoga.
    */

    document.getElementById(
        "status"
    ).innerText =
        "🟠 Office से बाहर - 5 मिनट Grace";


    document.getElementById(
        "status"
    ).className =
        "status waiting";


    document.getElementById(
        "message"
    ).innerText =
        "आप Office radius से बाहर हैं। 5 मिनट के अंदर वापस आने पर OUT नहीं होगा।";


    /*
      Agar outside_since already saved hai
      to नया timer नहीं बनेगा.
    */

    if(
        currentAttendance.outside_since
    ){

        startOutsideTimer(
            new Date(
                currentAttendance.outside_since
            ).getTime()
        );

    }else{

        await saveOutsideSince(
            latitude,
            longitude
        );
    }
}


/* =====================================
   LOCATION ERROR
===================================== */

function locationError(error){

    document.getElementById(
        "status"
    ).innerText =
        "⚠️ Location नहीं मिली";


    document.getElementById(
        "status"
    ).className =
        "status waiting";


    document.getElementById(
        "message"
    ).innerText =
        "Location Error: " +
        error.message;
}


/* =====================================
   START GPS
===================================== */

function startLocationTracking(){

    if(
        !navigator.geolocation
    ){

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ GPS उपलब्ध नहीं है";

        return;
    }


    watchId =
        navigator.geolocation.watchPosition(

            handleLocation,

            locationError,

            {

                enableHighAccuracy:true,

                timeout:20000,

                maximumAge:3000

            }
        );
}


/* =====================================
   REFRESH LOCATION
===================================== */

function refreshLocation(){

    if(
        !navigator.geolocation
    ){

        return;
    }


    document.getElementById(
        "message"
    ).innerText =
        "GPS location refresh हो रही है...";


    navigator.geolocation.getCurrentPosition(

        handleLocation,

        locationError,

        {

            enableHighAccuracy:true,

            timeout:20000,

            maximumAge:0

        }
    );
}


/* =====================================
   ATTENDANCE DISPLAY
===================================== */

function updateAttendanceDisplay(){

    if(!currentAttendance){

        document.getElementById(
            "inTime"
        ).innerText =
            "—";

        document.getElementById(
            "outTime"
        ).innerText =
            "—";

        document.getElementById(
            "workingTime"
        ).innerText =
            "—";

        return;
    }


    if(
        currentAttendance.in_time
    ){

        document.getElementById(
            "inTime"
        ).innerText =
            formatTime(
                currentAttendance.in_time
            );
    }


    if(
        currentAttendance.out_time
    ){

        document.getElementById(
            "outTime"
        ).innerText =
            formatTime(
                currentAttendance.out_time
            );
    }else{

        document.getElementById(
            "outTime"
        ).innerText =
            "—";
    }


    if(
        currentAttendance.out_time &&
        currentAttendance.working_minutes !== null
    ){

        const minutes =
            Number(
                currentAttendance
                .working_minutes
            );


        const hours =
            Math.floor(
                minutes/60
            );


        const mins =
            minutes%60;


        document.getElementById(
            "workingTime"
        ).innerText =
            hours +
            "h " +
            mins +
            "m";

    }else{

        startWorkingTimeClock();
    }
}


/* =====================================
   WORKING TIME CLOCK
===================================== */

let workingClock = null;


function startWorkingTimeClock(){

    if(workingClock){

        clearInterval(
            workingClock
        );
    }


    function update(){

        if(
            !currentAttendance ||
            !currentAttendance.in_time
        ){

            return;
        }


        if(
            currentAttendance.out_time
        ){

            return;
        }


        const start =
            new Date(
                currentAttendance.in_time
            ).getTime();


        const diff =
            Math.max(
                0,
                Date.now()-start
            );


        const totalMinutes =
            Math.floor(
                diff/60000
            );


        const hours =
            Math.floor(
                totalMinutes/60
            );


        const mins =
            totalMinutes%60;


        document.getElementById(
            "workingTime"
        ).innerText =
            hours +
            "h " +
            mins +
            "m";
    }


    update();


    workingClock =
        setInterval(
            update,
            30000
        );
}


/* =====================================
   FORMAT TIME
===================================== */

function formatTime(value){

    return new Date(value)
        .toLocaleTimeString(
            "en-IN",
            {

                hour:"2-digit",

                minute:"2-digit",

                second:"2-digit"

            }
        );
}


/* =====================================
   VISIBILITY
===================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            refreshLocation();
        }

    }
);


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    if(
        watchId !== null
    ){

        navigator.geolocation
        .clearWatch(
            watchId
        );

        watchId = null;
    }


    if(outsideTimer){

        clearInterval(
            outsideTimer
        );

        outsideTimer = null;
    }


    if(workingClock){

        clearInterval(
            workingClock
        );

        workingClock = null;
    }


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "employee-login.html";
}


/* =====================================
   START APP
===================================== */

async function startApp(){

    const user =
        await getCurrentUser();

    if(!user){

        return;
    }


    const employeeLoaded =
        await loadEmployee(user);

    if(!employeeLoaded){

        return;
    }


    const officeLoaded =
        await loadOffice();

    if(!officeLoaded){

        return;
    }


    /*
      पहले database से attendance
      load होगी.
    */

    await loadAttendance();


    /*
      उसके बाद GPS start होगा.
    */

    startLocationTracking();
}


startApp();

</script>
