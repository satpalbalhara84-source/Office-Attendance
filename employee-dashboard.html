<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Employee Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fa;
}

.header{
    background:#2563eb;
    color:white;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.status{
    font-size:24px;
    font-weight:bold;
    margin:15px 0;
}

.inside{
    color:#16a34a;
}

.outside{
    color:#dc2626;
}

.waiting{
    color:#d97706;
}

.location{
    background:#f8fafc;
    padding:15px;
    border-radius:10px;
    line-height:1.8;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    margin-top:10px;
}

.gpsBtn{
    background:#2563eb;
    color:white;
}

.inBtn{
    background:#16a34a;
    color:white;
}

.logout{
    background:#dc2626;
    color:white;
}

button:disabled{
    opacity:.5;
}

#message{
    margin-top:15px;
    line-height:1.6;
}

</style>

</head>


<body>

<div class="header">

    <h2>Office Attendance</h2>

    <div>
        Employee Dashboard
    </div>

</div>


<div class="container">


<div class="card">

    <h2 id="employeeName">
        Loading...
    </h2>

    <div id="status"
         class="status waiting">

        📍 GPS Checking...

    </div>

</div>


<div class="card">

    <h3>📍 Location Status</h3>

    <div class="location">

        <div>
            Distance from Office:
            <strong id="distance">
                —
            </strong>
        </div>

        <div>
            Office Radius:
            <strong id="radius">
                —
            </strong>
        </div>

        <div>
            Latitude:
            <strong id="latitude">
                —
            </strong>
        </div>

        <div>
            Longitude:
            <strong id="longitude">
                —
            </strong>
        </div>

        <div>
            GPS Accuracy:
            <strong id="accuracy">
                —
            </strong>
        </div>

    </div>


    <p id="message">
        GPS location ली जा रही है...
    </p>


    <button
        class="gpsBtn"
        onclick="getLocation()">

        📍 मेरी Location Check करें

    </button>


    <button
        id="inButton"
        class="inBtn"
        onclick="markIN()"
        disabled>

        🟢 Mark IN

    </button>

</div>


<div class="card">

    <h3>Today's Attendance</h3>

    <div>
        IN Time:
        <strong id="inTime">
            —
        </strong>
    </div>

</div>


<button
    class="logout"
    onclick="logout()">

    Logout

</button>


</div>


<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   VARIABLES
===================================== */

let currentUser = null;

let employee = null;

let office = null;

let currentLatitude = null;

let currentLongitude = null;

let currentAccuracy = null;

let canMarkIN = false;


/* =====================================
   MESSAGE
===================================== */

function message(text){

    document.getElementById(
        "message"
    ).innerText = text;

}


/* =====================================
   LOGIN USER
===================================== */

async function loadUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    if(
        error ||
        !data.session
    ){

        window.location.href =
            "employee-login.html";

        return false;
    }


    currentUser =
        data.session.user;

    return true;
}


/* =====================================
   LOAD EMPLOYEE
===================================== */

async function loadEmployee(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select("*")
        .eq(
            "email",
            currentUser.email
        )
        .limit(1);


    if(error){

        message(
            "Employee Error: " +
            error.message
        );

        return false;
    }


    if(
        !data ||
        data.length === 0
    ){

        message(
            "Employee record नहीं मिला।"
        );

        return false;
    }


    employee =
        data[0];


    document.getElementById(
        "employeeName"
    ).innerText =
        "Welcome, " +
        employee.name;


    return true;
}


/* =====================================
   LOAD OFFICE
===================================== */

async function loadOffice(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("offices")
        .select("*")
        .eq(
            "owner_id",
            employee.owner_id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(1);


    if(error){

        message(
            "Office Error: " +
            error.message
        );

        return false;
    }


    if(
        !data ||
        data.length === 0
    ){

        message(
            "Office location नहीं मिली।"
        );

        return false;
    }


    office =
        data[0];


    document.getElementById(
        "radius"
    ).innerText =
        office.radius_meters +
        " meters";


    message(
        "Office location मिल गई। अब GPS Check करें।"
    );


    return true;
}


/* =====================================
   DISTANCE CALCULATION
===================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;

    const dLat =
        (
            lat2-lat1
        ) *
        Math.PI / 180;

    const dLon =
        (
            lon2-lon1
        ) *
        Math.PI / 180;


    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1 *
            Math.PI / 180
        )

        *

        Math.cos(
            lat2 *
            Math.PI / 180
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;
}


/* =====================================
   GET GPS
===================================== */

function getLocation(){

    if(
        !navigator.geolocation
    ){

        message(
            "इस device में GPS उपलब्ध नहीं है।"
        );

        return;
    }


    document.getElementById(
        "status"
    ).innerText =
        "📍 GPS Checking...";


    document.getElementById(
        "status"
    ).className =
        "status waiting";


    message(
        "GPS location ली जा रही है..."
    );


    navigator.geolocation.getCurrentPosition(

        gpsSuccess,

        gpsError,

        {
            enableHighAccuracy:true,
            timeout:60000,
            maximumAge:0
        }

    );
}


/* =====================================
   GPS SUCCESS
===================================== */

function gpsSuccess(position){

    currentLatitude =
        position.coords.latitude;

    currentLongitude =
        position.coords.longitude;

    currentAccuracy =
        position.coords.accuracy;


    document.getElementById(
        "latitude"
    ).innerText =
        currentLatitude.toFixed(6);


    document.getElementById(
        "longitude"
    ).innerText =
        currentLongitude.toFixed(6);


    document.getElementById(
        "accuracy"
    ).innerText =
        Math.round(
            currentAccuracy
        ) +
        " meters";


    if(!office){

        message(
            "Office information उपलब्ध नहीं है।"
        );

        return;
    }


    const distance =
        calculateDistance(

            currentLatitude,

            currentLongitude,

            Number(
                office.latitude
            ),

            Number(
                office.longitude
            )

        );


    document.getElementById(
        "distance"
    ).innerText =
        Math.round(distance) +
        " meters";


    const radius =
        Number(
            office.radius_meters
        );


    if(
        distance <= radius
    ){

        canMarkIN =
            true;


        document.getElementById(
            "status"
        ).innerText =
            "🟢 Office के अंदर";


        document.getElementById(
            "status"
        ).className =
            "status inside";


        document.getElementById(
            "inButton"
        ).disabled =
            false;


        message(
            "आप Office के अंदर हैं। अब Mark IN दबाएँ।"
        );


    }else{

        canMarkIN =
            false;


        document.getElementById(
            "status"
        ).innerText =
            "🔴 Office से बाहर";


        document.getElementById(
            "status"
        ).className =
            "status outside";


        document.getElementById(
            "inButton"
        ).disabled =
            true;


        message(
            "आप Office Radius से बाहर हैं।"
        );
    }
}


/* =====================================
   GPS ERROR
===================================== */

function gpsError(error){

    let text =
        "GPS Error";


    if(
        error.code === 1
    ){

        text =
            "Location Permission Denied। Browser में Location Allow करें।";

    }else if(
        error.code === 2
    ){

        text =
            "Location उपलब्ध नहीं है। Phone की GPS Location ON करें।";

    }else if(
        error.code === 3
    ){

        text =
            "GPS Timeout। खुले स्थान पर जाकर दोबारा कोशिश करें।";
    }


    document.getElementById(
        "status"
    ).innerText =
        "⚠️ GPS समस्या";


    document.getElementById(
        "status"
    ).className =
        "status waiting";


    message(text);
}


/* =====================================
   MARK IN
===================================== */

async function markIN(){

    if(!canMarkIN){

        message(
            "पहले Office के अंदर होना जरूरी है।"
        );

        return;
    }


    if(
        !employee ||
        !office
    ){

        message(
            "Employee या Office information नहीं मिली।"
        );

        return;
    }


    document.getElementById(
        "inButton"
    ).disabled =
        true;


    message(
        "Attendance save की जा रही है..."
    );


    const now =
        new Date();


    const {
        data,
        error
    } =
    await supabaseClient
        .from("attendance")
        .insert({

            employee_id:
                employee.id,

            office_id:
                office.id,

            in_time:
                now.toISOString(),

            status:
                "present",

            last_latitude:
                currentLatitude,

            last_longitude:
                currentLongitude

        })
        .select()
        .limit(1);


    if(error){

        console.log(
            "IN ERROR:",
            error
        );


        document.getElementById(
            "inButton"
        ).disabled =
            false;


        message(
            "❌ IN Attendance Error: " +
            error.message
        );


        return;
    }


    document.getElementById(
        "inTime"
    ).innerText =
        now.toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );


    document.getElementById(
        "status"
    ).innerText =
        "🟢 IN हो गया";


    document.getElementById(
        "status"
    ).className =
        "status inside";


    message(
        "Attendance successfully लग गई ✅"
    );

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();

    window.location.href =
        "employee-login.html";
}


/* =====================================
   START
===================================== */

async function startApp(){

    const userLoaded =
        await loadUser();


    if(!userLoaded)
        return;


    const employeeLoaded =
        await loadEmployee();


    if(!employeeLoaded)
        return;


    const officeLoaded =
        await loadOffice();


    if(!officeLoaded)
        return;


    getLocation();
}


startApp();


</script>

</body>

</html>
