<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Office Attendance Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f6fa;
}

.login-box{
    width:380px;
    max-width:92%;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

h1{
    color:#2563eb;
    margin-bottom:8px;
}

p{
    color:#666;
}

input{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    margin-top:18px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#message{
    margin-top:15px;
    font-size:14px;
}

</style>

</head>


<body>

<div class="login-box">

<h1>Office Attendance</h1>

<p>Login करें</p>


<input
    type="email"
    id="email"
    placeholder="Email"
>


<input
    type="password"
    id="password"
    placeholder="Password"
>


<button
    id="loginBtn"
    onclick="loginUser()">

    Login

</button>


<p id="message"></p>

</div>


<script>


const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   LOGIN
================================= */

async function loginUser(){

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("loginBtn");


    if(!email || !password){

        message.innerText =
            "Email और Password भरें";

        message.style.color =
            "red";

        return;
    }


    button.disabled = true;


    message.innerText =
        "Login हो रहा है...";

    message.style.color =
        "#2563eb";


    try{

        const result =
            await db.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(result.error){

            throw result.error;

        }


        if(!result.data.user){

            throw new Error(
                "User नहीं मिला"
            );

        }


        message.innerText =
            "Login Successful ✅";

        message.style.color =
            "green";


        /*
        =================================
        OWNER CHECK
        =================================

        अभी आपके system में
        यह Owner account है।
        */

        if(
            email ===
            "satpalbalhara84@gmail.com"
        ){

            message.innerText =
                "Owner Login Successful ✅";


            setTimeout(function(){

                window.location.replace(
                    "dashboard.html"
                );

            },500);


            return;
        }


        /*
        =================================
        EMPLOYEE
        =================================
        */

        message.innerText =
            "Employee Login Successful ✅";


        setTimeout(function(){

            window.location.replace(
                "employee-dashboard.html"
            );

        },500);

    }

    catch(error){

        console.error(error);

        message.innerText =
            "Login Failed: " +
            error.message;

        message.style.color =
            "red";

        button.disabled = false;

    }

}


/* =================================
   ENTER KEY
================================= */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            loginUser();

        }

    }
);

</script>

</body>

</html>
