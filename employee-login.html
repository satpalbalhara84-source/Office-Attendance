<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Office Attendance Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f6fa;
}

.login-box{
    width:380px;
    max-width:92%;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

h1{
    color:#2563eb;
    margin-bottom:8px;
}

p{
    color:#666;
}

input{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    margin-top:18px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#message{
    margin-top:15px;
    font-size:14px;
}

</style>

</head>


<body>

<div class="login-box">

<h1>Office Attendance</h1>

<p>Login करें</p>


<input
    type="email"
    id="email"
    placeholder="Email"
>


<input
    type="password"
    id="password"
    placeholder="Password"
>


<button
    id="loginBtn"
    onclick="loginUser()">

    Login

</button>


<p id="message"></p>

</div>


<script>


/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   LOGIN
================================= */

async function loginUser(){

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("loginBtn");


    if(!email || !password){

        message.innerText =
            "Email और Password भरें";

        message.style.color =
            "red";

        return;
    }


    button.disabled = true;


    message.innerText =
        "Login हो रहा है...";

    message.style.color =
        "#2563eb";


    try{

        /* ==============================
           SUPABASE LOGIN
        ============================== */

        const result =
            await db.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(result.error){

            throw result.error;

        }


        const user =
            result.data.user;


        if(!user){

            throw new Error(
                "User नहीं मिला"
            );

        }


        message.innerText =
            "Login Successful ✅";

        message.style.color =
            "green";


        /* ==============================
           1. SUPER ADMIN CHECK
        ============================== */

        const adminResult =
            await db
            .from("admin_users")
            .select("user_id")
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


        if(adminResult.error){

            console.log(
                "Admin check:",
                adminResult.error.message
            );

        }


        if(
            adminResult.data &&
            adminResult.data.user_id
        ){

            message.innerText =
                "Super Admin Login Successful ✅";


            setTimeout(function(){

                window.location.replace(
                    "admin.html"
                );

            },500);


            return;
        }


        /* ==============================
           2. OWNER CHECK
        ============================== */

        const factoryResult =
            await db
            .from("factories")
            .select("id")
            .eq(
                "owner_id",
                user.id
            )
            .limit(1);


        if(factoryResult.error){

            console.log(
                "Owner check:",
                factoryResult.error.message
            );

        }


        if(
            factoryResult.data &&
            factoryResult.data.length > 0
        ){

            message.innerText =
                "Owner Login Successful ✅";


            setTimeout(function(){

                window.location.replace(
                    "dashboard.html"
                );

            },500);


            return;
        }


        /* ==============================
           3. EMPLOYEE CHECK
        ============================== */

        const employeeResult =
            await db
            .from("employees")
            .select("id")
            .eq(
                "email",
                email
            )
            .limit(1);


        if(employeeResult.error){

            console.log(
                "Employee check:",
                employeeResult.error.message
            );

        }


        if(
            employeeResult.data &&
            employeeResult.data.length > 0
        ){

            message.innerText =
                "Employee Login Successful ✅";


            setTimeout(function(){

                window.location.replace(
                    "employee-dashboard.html"
                );

            },500);


            return;
        }


        /* ==============================
           UNKNOWN USER
        ============================== */

        await db.auth.signOut();


        throw new Error(
            "इस account का Owner या Employee record नहीं मिला।"
        );

    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        message.innerText =
            "Login Failed: " +
            error.message;

        message.style.color =
            "red";


        button.disabled = false;

    }

}


/* =================================
   ENTER KEY
================================= */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            loginUser();

        }

    }
);

</script>

</body>

</html>
