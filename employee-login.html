<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Office Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f6fa;
}

.login-box{
    width:380px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,0.12);
    text-align:center;
}

h1{
    color:#2563eb;
    margin-bottom:8px;
}

p{
    color:#666;
}

input{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    margin-top:18px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#message{
    margin-top:15px;
    font-size:14px;
}

</style>

</head>


<body>


<div class="login-box">

    <h1>Office Attendance</h1>

    <p>Login करें</p>


    <input
        type="email"
        id="email"
        placeholder="Email"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <button
        id="loginButton"
        onclick="loginUser()">

        Login

    </button>


    <p id="message"></p>

</div>


<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://mxolpvdaengfpmlkgprc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_KaXl_tgIR8VZhmWR6vuAgQ_FswcmZes";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   LOGIN
===================================== */

async function loginUser(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    const button =
        document.getElementById(
            "loginButton"
        );


    if(!email || !password){

        message.innerText =
            "Email और Password भरें";

        message.style.color =
            "red";

        return;
    }


    button.disabled = true;


    message.innerText =
        "Login हो रहा है...";

    message.style.color =
        "#2563eb";


    try{


        /* =============================
           SUPABASE LOGIN
        ============================= */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.user
        ){

            throw new Error(
                "User information नहीं मिली।"
            );

        }


        const user =
            data.user;


        message.innerText =
            "Login Successful ✅";


        message.style.color =
            "green";


        /* =============================
           OWNER CHECK
        ============================= */

        /*
           अगर current user का ID
           किसी employee के owner_id
           में है, तो यह OWNER है।
        */

        const ownerCheck =
            await supabaseClient
                .from("employees")
                .select("id")
                .eq(
                    "owner_id",
                    user.id
                )
                .limit(1);


        if(ownerCheck.error){

            console.error(
                "Owner check error:",
                ownerCheck.error
            );

        }


        /* =============================
           OWNER
        ============================= */

        if(
            ownerCheck.data &&
            ownerCheck.data.length > 0
        ){

            message.innerText =
                "Owner Login Successful ✅";


            setTimeout(() => {

                window.location.href =
                    "dashboard.html";

            },700);


            return;
        }


        /* =============================
           EMPLOYEE
        ============================= */

        const employeeCheck =
            await supabaseClient
                .from("employees")
                .select("id")
                .eq(
                    "email",
                    user.email
                )
                .limit(1);


        if(employeeCheck.error){

            console.error(
                "Employee check error:",
                employeeCheck.error
            );

        }


        if(
            employeeCheck.data &&
            employeeCheck.data.length > 0
        ){

            message.innerText =
                "Employee Login Successful ✅";


            setTimeout(() => {

                window.location.href =
                    "employee-dashboard.html";

            },700);


            return;
        }


        /* =============================
           USER NOT FOUND
        ============================= */

        message.innerText =
            "यह account Owner या Employee के रूप में registered नहीं है।";


        message.style.color =
            "red";


        await supabaseClient.auth.signOut();


    }

    catch(error){

        console.error(error);


        message.innerText =
            "Login Failed: " +
            (
                error.message ||
                "Unknown error"
            );


        message.style.color =
            "red";

    }

    finally{

        button.disabled = false;

    }

}


/* =====================================
   ENTER KEY LOGIN
===================================== */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                loginUser();

            }

        }
    );

</script>


</body>

</html>
